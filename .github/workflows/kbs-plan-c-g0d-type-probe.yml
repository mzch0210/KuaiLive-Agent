name: KBS Plan C G0-D type-only recovery probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/kbs-plan-c-g0d-type-probe.yml']
permissions: {contents: read}
jobs:
  user-host-types:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, gpu-3090]
    timeout-minutes: 8
    concurrency:
      group: kuailive-gpu-3090
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Inspect 100 token encodings per field, never upload raw IDs
        run: |
          set -euo pipefail
          export PYTHONPATH="$HOME/.cache/kuailive-agent-kbs/audit-py312-tools-v1"
          "$HOME/venvs/kuailive-gpu/bin/python" analysis/kbs_plan_c/g0d_type_probe.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kbs-plan-c-g0d-type-diagnostic
          path: g0d_types.json
          retention-days: 2
