name: KBS Plan C G0-D full temporal and room-eligibility audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/kbs-plan-c-g0d-full-audit.yml']
permissions:
  contents: read
jobs:
  hosted-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check corrected source timestamp parser on synthetic examples
        run: |
          python -m py_compile analysis/kbs_plan_c/g0d_full_audit.py
          python -m unittest discover -s analysis/kbs_plan_c -p 'test_g0d_full_audit.py' -v
  user-host-audit:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'authorize corrected M3 full temporal audit')
    needs: hosted-smoke
    runs-on: [self-hosted, linux, x64, gpu-3090]
    timeout-minutes: 55
    concurrency:
      group: kuailive-gpu-3090
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          clean: true
      - name: Verify persistent source and previously installed isolated offline wheels
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test -s "$HOME/.cache/kuailive-agent-kbs/klm3/SHA256SUMS"
          export PYTHONPATH="$HOME/.cache/kuailive-agent-kbs/audit-py312-tools-v1"
          "$HOME/venvs/kuailive-gpu/bin/python" - <<'PY'
          import pyarrow,numpy
          assert pyarrow.__version__=='17.0.0'
          print('Reusing isolated preinstalled Parquet reader; no network or venv edits.')
          PY
      - name: Re-run complete streaming timestamp, relation and lifecycle audit
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$HOME/.cache/kuailive-agent-kbs/audit-py312-tools-v1"
          export PYTHONUNBUFFERED=1
          export OPENBLAS_NUM_THREADS=1
          export OMP_NUM_THREADS=1
          PY="$HOME/venvs/kuailive-gpu/bin/python"
          "$PY" analysis/kbs_plan_c/g0d_full_audit.py \
            --root "$HOME/.cache/kuailive-agent-kbs/klm3" \
            --out g0d_aggregates/full_source_audit_corrected.json \
            --sample-stride 2500
          "$PY" - <<'PY'
          import json
          a=json.load(open('g0d_aggregates/full_source_audit_corrected.json'))
          b=a['streaming_interaction_audit']
          assert a['schema']=='kbs-plan-c-g0d-full-aggregate-v2'
          assert a['sha256_reverified']
          assert a['valid_room_ids'] > 1000000
          assert b['events']['rows'] > 30000000
          assert b['unique_users'] > 15000
          assert b['events']['room_id_matched'] > 0
          assert b['utc_event_date_range']['first'] is not None
          assert b['sampled_exact_live_room_candidates']['n'] > 100
          assert a['no_test_ranking_metrics_computed'] and a['no_model_trained']
          print('G0-D CORRECTED AGGREGATE AUDIT PASS')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kbs-plan-c-g0d-corrected-aggregate
          path: g0d_aggregates/full_source_audit_corrected.json
          if-no-files-found: error
          retention-days: 14
