name: DS-Frame matched-budget collision validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/export_dsframe_full.py'
      - 'scripts/export_dsframe_scores.py'
      - 'analysis/dsframe_matched_budget.py'
      - '.github/workflows/dsframe-matched-budget.yml'

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: ${{ github.workspace }}/src
  DS_COMMIT: c216ec4358f0cc2b834c4069e535cd10c7d8d486
  DATASET: KuaiLiveDSFull
  SEED: '20260918'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: pip install 'numpy<2' 'pandas<3' tqdm
      - name: Download and prepare KuaiLive shop
        run: |
          python scripts/download_kuailive.py --data-root data
          python -m kuailive_agent.prepare --data-dir "$(cat data/dataset_dir.txt)" --out-dir data/prepared/shop --scope shop
      - name: Export full DS-Frame training corpus and frozen candidates
        run: |
          python scripts/export_dsframe_full.py --prepared-dir data/prepared/shop --out-root ds_data --dataset "$DATASET" --n-neg 574 --seed "$SEED" --history-max 50
          cat "ds_data/$DATASET/export_meta.json"
      - uses: actions/upload-artifact@v4
        with:
          name: dsframe-full-data-${{ github.run_id }}
          path: ds_data/**
          retention-days: 7

  train_dsframe:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - uses: actions/download-artifact@v4
        with:
          name: dsframe-full-data-${{ github.run_id }}
          path: ds_data
      - name: Install CPU runtime
        run: |
          pip install 'torch==2.4.1' --index-url https://download.pytorch.org/whl/cpu
          pip install 'numpy<2' 'pandas<3' tqdm 'scipy<2' requests 'openai==1.70.0'
      - name: Pin official DS-Frame and apply documented compatibility patches
        run: |
          git clone --filter=blob:none https://github.com/ZichenYuan233/Recommender-System-as-Slow-and-Fast-Thinkers.git third_party/dsframe
          cd third_party/dsframe && git checkout "$DS_COMMIT"
          cat > swanlab.py <<'PY'
          def init(*args, **kwargs): return None
          def log(*args, **kwargs): return None
          PY
          cat > helpers/__init__.py <<'PY'
          __all__ = ['BaseReader', 'BaseRunner']
          PY
          cat > models/__init__.py <<'PY'
          __all__ = ['PRL']
          PY
          python - <<'PY'
          from pathlib import Path
          p=Path('models/PRL.py'); s=p.read_text()
          needle='        # thinking contrastive loss\n        if repeat_times > 1 and self.cl_weight > 0:\n'
          repl='        # thinking contrastive loss\n        cl_loss = torch.zeros((), device=logits.device)\n        if repeat_times > 1 and self.cl_weight > 0:\n'
          if needle not in s: raise SystemExit('Expected PRL warmup bug block not found')
          p.write_text(s.replace(needle,repl,1))
          PY
      - name: Train capacity-matched PRL
        run: |
          mkdir -p ds_results
          /usr/bin/time -v -o ds_results/time.txt python third_party/dsframe/main.py \
            --model_name PRL --path "$GITHUB_WORKSPACE/ds_data" --dataset "$DATASET" --gpu '' --random_seed "$SEED" \
            --epoch 15 --early_stop 5 --emb_size 64 --num_layers 1 --num_heads 4 --inner_size 128 --dropout 0.2 \
            --temperature 0.07 --reason_step 2 --pl_weight 1.0 --temp_scale 5.0 --noise_factor 0.01 --cl_weight 1.0 --warmup 2 \
            --lr 0.0005 --l2 1e-6 --batch_size 512 --eval_batch_size 128 --num_workers 2 \
            --topk 10 --metric NDCG,HR --main_metric NDCG@10 --test_epoch -1 --regenerate 1 \
            --log_file "$GITHUB_WORKSPACE/ds_results/prl.log" --model_path "$GITHUB_WORKSPACE/ds_results/prl.pt"
      - name: Export fast/slow candidate utility and selector features
        run: |
          python scripts/export_dsframe_scores.py --ds-source third_party/dsframe --data-root ds_data --dataset "$DATASET" \
            --model-path ds_results/prl.pt --candidates "ds_data/$DATASET/eval_candidates.npz" --out ds_results/ds_scores.npz --batch-size 128
          cat ds_results/ds_scores.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsframe-full-scores-${{ github.run_id }}
          path: |
            ds_results/**
            ds_data/KuaiLiveDSFull/export_meta.json
          retention-days: 14

  evaluate:
    needs: train_dsframe
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: |
          pip install 'torch==2.4.1' --index-url https://download.pytorch.org/whl/cpu
          pip install 'numpy<2' 'pandas<3' 'scikit-learn<2'
      - uses: actions/download-artifact@v4
        with:
          name: dsframe-full-scores-${{ github.run_id }}
          path: ds_out
      - name: Reuse frozen SASRec full predictions
        uses: actions/download-artifact@v4
        with:
          name: fair-sasrec-residual-validation-35432625700
          repository: mzch0210/KuaiLive-Agent
          run-id: 35432625700
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: sas_frozen
      - name: Reuse locked fair residual per-user tables
        uses: actions/download-artifact@v4
        with:
          name: recovered-fair-residual-results-35436149252
          repository: mzch0210/KuaiLive-Agent
          run-id: 35436149252
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: residual_frozen
      - name: Resolve artifacts and run matched-budget comparison
        run: |
          DEV=$(find sas_frozen -type f -name 'rec-SASRec-dev.csv' | head -1)
          TEST=$(find sas_frozen -type f -name 'rec-SASRec-test.csv' | head -1)
          SCORES=$(find ds_out -type f -name 'ds_scores.npz' | head -1)
          test -n "$DEV" && test -n "$TEST" && test -n "$SCORES"
          test "$(find sas_frozen -type f -name 'rec-SASRec-dev.csv' | wc -l)" -eq 1
          test "$(find sas_frozen -type f -name 'rec-SASRec-test.csv' | wc -l)" -eq 1
          python analysis/dsframe_matched_budget.py --recovered-dir residual_frozen --sasrec-dev "$DEV" --sasrec-test "$TEST" --ds-scores "$SCORES" --out-dir matched_results
          cat matched_results/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsframe-matched-budget-results-${{ github.run_id }}
          path: matched_results/**
          retention-days: 30
