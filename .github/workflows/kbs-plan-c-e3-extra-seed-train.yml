name: KBS Plan C E3 two extra preregistered Base seeds
on:
  push:
    branches: [main]
    paths: ['.github/workflows/kbs-plan-c-e3-extra-seed-train.yml']
permissions:
  contents: read
jobs:
  hosted-plan-lock:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'authorize E3 two extra preregistered seeds')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Check original pre-TEST protocol and two fixed seeds
        run: |
          python - <<'PY'
          import json
          p=json.load(open('experiments/kbs_plan_c/G0F_PRETEST_PROTOCOL_2026-10-12.json'))
          assert p['models']['primary_seed']==20261012
          assert p['models']['additional_seeds']==[20261013,20261014]
          assert p['models']['latent_dim']==64 and p['models']['context_length']==16
          assert p['meta']['test_performance_seen'] is False
          PY
  user-host-serial-seeds:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'authorize E3 two extra preregistered seeds')
    needs: hosted-plan-lock
    runs-on: [self-hosted, linux, x64, gpu-3090]
    timeout-minutes: 160
    concurrency:
      group: kuailive-gpu-3090
      cancel-in-progress: false
    steps:
      - name: Guard original TRAIN-only index and 3090
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REPOSITORY" = mzch0210/KuaiLive-Agent
          test "$GITHUB_REF" = refs/heads/main
          test "$(id -u)" -ne 0
          test -s "$HOME/.cache/kuailive-agent-kbs/klm3_g2_train_index_v1/index_manifest.json"
          test -x "$HOME/venvs/kuailive-gpu/bin/python"
          nvidia-smi
      - uses: actions/cache/restore@v4
        with:
          key: kbs-plan-c-g2-train-only-sasrec-gru4rec-code-v2
          path: g2-code/
          fail-on-cache-miss: true
      - name: Verify exact existing training code and immutable original G1 cache
        shell: bash
        run: |
          set -euo pipefail
          (cd g2-code && sha256sum -c SHA256SUMS)
          "$HOME/venvs/kuailive-gpu/bin/python" - <<'PY'
          import json,pathlib,torch
          r=pathlib.Path.home()/'.cache/kuailive-agent-kbs'
          a=json.load(open(r/'klm3_plan_c_g1_v1/manifest.json'))
          b=json.load(open(r/'klm3_g2_train_index_v1/index_manifest.json'))
          assert a['protocol_sha256']=='bf6234eb95ecb24a568b2e7556846c41c4f3e1fdcd7774397003beaf56341a3c'
          assert b['g1_protocol_sha256']==a['protocol_sha256']
          assert b['total_training_events']==24995148 and b['unique_train_authors']==897025
          assert b['training_only'] and not b['test_files_opened']
          assert torch.cuda.is_available() and '3090' in torch.cuda.get_device_name(0)
          PY
      - name: Train both fixed seeds consecutively with existing 3090 index
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export PYTHONPATH="$PWD/g2-code:$HOME/.cache/kuailive-agent-kbs/audit-py312-tools-v1"
          export OPENBLAS_NUM_THREADS=1
          export OMP_NUM_THREADS=2
          export PYTHONUNBUFFERED=1
          PY="$HOME/venvs/kuailive-gpu/bin/python"
          ROOT="$HOME/.cache/kuailive-agent-kbs"
          G1="$ROOT/klm3_plan_c_g1_v1"
          IDX="$ROOT/klm3_g2_train_index_v1"
          mkdir -p extra-seed-report
          for SEED in 20261013 20261014; do
            OUT="$ROOT/klm3_g2_seed$(printf %s "$SEED")_epoch3_v1"
            mkdir -p "$OUT"
            for MODEL in sasrec gru4rec; do
              REPORT="$OUT/$MODEL/"$MODEL"_train_report.json"
              if [ -s "$REPORT" ]; then
                echo "Already trained $SEED $MODEL, reuse validated report"
              else
                test ! -e "$OUT/$MODEL" || {
                  echo "Incomplete model directory; inspect rather than overwrite" >&2
                  exit 17
                }
                "$PY" g2-code/g2_train_base.py \
                  --g1 "$G1" --index "$IDX" --out "$OUT/$MODEL" \
                  --mode train --model "$MODEL" --seed "$SEED" \
                  --epochs 3 --steps-per-epoch 24410 \
                  --batch 1024 --negatives 32 --learning-rate 0.001 \
                  --log-interval 2000
              fi
              cp "$REPORT" "extra-seed-report/seed$(printf %s "$SEED")_$MODEL.json"
            done
          done
          cp "$IDX/index_manifest.json" extra-seed-report/index_manifest.json
          "$PY" - <<'PY'
          import json,pathlib
          for seed in (20261013,20261014):
              for model in ('sasrec','gru4rec'):
                  p=pathlib.Path('extra-seed-report')/('seed'+str(seed)+'_'+model+'.json')
                  x=json.loads(p.read_text())
                  assert x['seed']==seed and x['model_family']==model
                  assert x['status']=='TRAIN_CHECKPOINTS_NOT_DEV_SELECTED'
                  assert len(x['train_records'])==3
                  assert all('checkpoint_sha256' in e for e in x['train_records'])
                  assert not x['dev_outcomes_read'] and not x['test_outcomes_read']
          print('E3 two extra TRAIN-only seeds fitted and checksum-logged; TEST still sealed')
          PY
      - name: Upload only small seed/provenance reports; checkpoints remain private
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kbs-plan-c-e3-extra-seed-train-manifests
          path: extra-seed-report/
          if-no-files-found: warn
          retention-days: 21
