name: KBS Plan C DEV OOF gate engine synthetic CI
on:
  push:
    branches: [main]
    paths:
      - 'analysis/kbs_plan_c/train_gate_oof.py'
      - 'analysis/kbs_plan_c/test_train_gate_oof.py'
      - '.github/workflows/kbs-plan-c-gate-oof-smoke.yml'
permissions:
  contents: read
jobs:
  hosted-oof-synthetic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install CPU-only fixed comparison dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            'numpy==1.26.4' 'pandas==2.2.3' 'scipy==1.14.1' \
            'scikit-learn==1.5.2' 'joblib==1.4.2'
      - name: Compile and run grouped OOF pipeline tests (synthetic DEV/TEST)
        run: |
          python -m py_compile analysis/kbs_plan_c/train_gate_oof.py
          python -m unittest discover -s analysis/kbs_plan_c -p 'test_train_gate_oof.py' -v
