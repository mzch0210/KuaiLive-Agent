name: KBS N9 Route B B4A A2 frozen DEV F S final gate models
on:
  push:
    branches: [main]
    paths: ['.github/workflows/kbs-n9-route-b-b4a-a2-dev-final-gates.yml']
permissions:
  contents: read
concurrency:
  group: kbs-n9-route-b-b4a-a2
  cancel-in-progress: false
jobs:
  four-dev-supervision-gates:
    runs-on: [self-hosted, linux, x64, gpu-3090]
    timeout-minutes: 100
    steps:
      - name: Build only DEV learned gate models and freeze OOF threshold with original code
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export PYTHONPATH="$RUNNER_TEMP:$HOME/.cache/kuailive-agent-kbs/e2-py312-sklearn-v1:$HOME/.cache/kuailive-agent-kbs/audit-py312-tools-v1"
          export OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 OMP_NUM_THREADS=4 PYTHONUNBUFFERED=1
          PY="$HOME/venvs/kuailive-gpu/bin/python"
          "$PY" -c 'import sklearn,joblib; assert sklearn.__version__.startswith("1.5.")'
          cat > "$RUNNER_TEMP/frozen_gate.py" <<'FROZEN_HELPER'
          #!/usr/bin/env python3
          """CPU-only DEV OOF gate freezing and unlabeled TEST mask application.
          
          Does not train Base models, read TEST outcomes, or calculate TEST quality.
          """
          from __future__ import annotations
          import argparse
          import csv
          import hashlib
          import json
          import math
          from pathlib import Path
          
          METHODS = ("utility", "difficulty", "specialist", "uncertainty", "history")
          FORBIDDEN_TEST_COLUMNS = {"base_ndcg10", "memory_ndcg10", "delta_ndcg10",
                                    "target_id", "target_item_id"}
          
          def load_rows(file: Path):
              with file.open(newline="", encoding="utf-8") as f:
                  reader = csv.DictReader(f)
                  if not reader.fieldnames:
                      raise ValueError("CSV header required")
                  return set(reader.fieldnames), list(reader)
          
          def hash_file(file: Path):
              h = hashlib.sha256()
              with file.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()
          
          def numeric(value, name):
              try:
                  x = float(value)
              except (TypeError, ValueError):
                  raise ValueError("invalid " + name) from None
              if not math.isfinite(x):
                  raise ValueError("nonfinite " + name)
              return x
          
          def select_threshold(scores, deltas, max_rate=0.30):
              """OOF DEV optimization for *pointwise* score>=threshold, ties indivisible."""
              n = len(scores)
              if n == 0 or n != len(deltas) or not (0 < max_rate <= 1):
                  raise ValueError("invalid score, target or budget input")
              if not all(math.isfinite(x) for x in scores + deltas):
                  raise ValueError("nonfinite input")
              cap = math.floor(max_rate * n)
              order = sorted(zip(scores, deltas), key=lambda pair: pair[0], reverse=True)
              best = {"threshold": None, "calls": 0, "dev_oof_gain": 0.0}
              running = 0.0
              i = 0
              while i < n:
                  j = i
                  while j < n and order[j][0] == order[i][0]:
                      running += order[j][1]
                      j += 1
                  gain = running / n
                  if j <= cap and gain > best["dev_oof_gain"] + 1e-14:
                      best = {"threshold": order[i][0], "calls": j,
                              "dev_oof_gain": gain}
                  i = j
              best["dev_oof_call_rate"] = best["calls"] / n
              return best
          
          def freeze_dev(dev_file: Path, oof_file: Path, out_file: Path, max_rate=0.30):
              oof = json.loads(oof_file.read_text(encoding="utf-8"))
              if (oof.get("phase") != "DEV" or
                      oof.get("predictions_are_oof") is not True or
                      oof.get("user_disjoint_across_folds") is not True or
                      len(oof.get("provenance_sha256", "")) != 64):
                  raise ValueError("DEV-only user-disjoint OOF provenance required")
              if oof["provenance_sha256"] != hash_file(dev_file):
                  raise ValueError("DEV OOF prediction CSV SHA256 mismatch")
              cols, rows = load_rows(dev_file)
              required = {"event_id", "split", "base_ndcg10", "memory_ndcg10"}
              required |= {"score_" + m for m in METHODS}
              if not rows or not required.issubset(cols):
                  raise ValueError("missing required DEV fields")
              if any(r["split"] != "DEV" for r in rows):
                  raise ValueError("TEST input forbidden during fitting")
              ids = [r["event_id"] for r in rows]
              if any(not x for x in ids) or len(set(ids)) != len(ids):
                  raise ValueError("DEV event ids must be nonempty and unique")
              base = [numeric(r["base_ndcg10"], "base") for r in rows]
              memory = [numeric(r["memory_ndcg10"], "memory") for r in rows]
              if any(not 0 <= x <= 1 for x in base + memory):
                  raise ValueError("NDCG must be in [0,1]")
              deltas = [m - b for b, m in zip(base, memory)]
              thresholds = {name: select_threshold(
                  [numeric(r["score_" + name], name) for r in rows], deltas, max_rate)
                  for name in METHODS}
              policy = {
                  "schema": "kbs-plan-c-gates-v1",
                  "state": "DEV_FROZEN_POINTWISE",
                  "oof_source_sha256": hash_file(oof_file),
                  "dev_source_sha256": hash_file(dev_file),
                  "oof_provenance_sha256": oof["provenance_sha256"],
                  "n_dev_events": len(rows),
                  "max_call_fraction": max_rate,
                  "methods": thresholds,
                  "test_outcomes_seen": False,
                  "note": "TEST top-m is hindsight diagnostic, not this frozen serving policy.",
              }
              out_file.parent.mkdir(parents=True, exist_ok=True)
              out_file.write_text(json.dumps(policy, indent=2) + "\n", encoding="utf-8")
              return policy
          
          def apply_unlabeled(policy_file: Path, features_file: Path, out_file: Path):
              policy = json.loads(policy_file.read_text(encoding="utf-8"))
              if (policy.get("schema") != "kbs-plan-c-gates-v1" or
                      policy.get("state") != "DEV_FROZEN_POINTWISE" or
                      policy.get("test_outcomes_seen") is not False):
                  raise ValueError("not an authorized DEV-frozen policy")
              cols, rows = load_rows(features_file)
              required = {"event_id", "split"} | {"score_" + m for m in METHODS}
              if not required.issubset(cols) or FORBIDDEN_TEST_COLUMNS & cols:
                  raise ValueError("TEST policy input must contain scores, not outcome labels")
              if not rows or any(r["split"] != "TEST" for r in rows):
                  raise ValueError("unlabeled TEST feature rows required")
              ids = [r["event_id"] for r in rows]
              if any(not x for x in ids) or len(ids) != len(set(ids)):
                  raise ValueError("invalid TEST event identities")
              out_file.parent.mkdir(parents=True, exist_ok=True)
              cols_out = ["event_id"] + ["call_" + m for m in METHODS]
              with out_file.open("w", newline="", encoding="utf-8") as f:
                  writer = csv.DictWriter(f, fieldnames=cols_out)
                  writer.writeheader()
                  for row in rows:
                      result = {"event_id": row["event_id"]}
                      for m in METHODS:
                          t = policy["methods"][m]["threshold"]
                          s = numeric(row["score_" + m], m)
                          result["call_" + m] = int(t is not None and s >= t)
                      writer.writerow(result)
              return len(rows)
          
          def main():
              ap = argparse.ArgumentParser()
              subs = ap.add_subparsers(dest="mode", required=True)
              fit = subs.add_parser("fit-dev")
              fit.add_argument("--dev", type=Path, required=True)
              fit.add_argument("--oof-manifest", type=Path, required=True)
              fit.add_argument("--out", type=Path, required=True)
              fit.add_argument("--max-call-fraction", type=float, default=0.30)
              apply = subs.add_parser("apply-unlabeled-test")
              apply.add_argument("--policy", type=Path, required=True)
              apply.add_argument("--features", type=Path, required=True)
              apply.add_argument("--out", type=Path, required=True)
              a = ap.parse_args()
              if a.mode == "fit-dev":
                  p = freeze_dev(a.dev, a.oof_manifest, a.out, a.max_call_fraction)
                  print(json.dumps({"state": p["state"], "methods": p["methods"]}))
              else:
                  n = apply_unlabeled(a.policy, a.features, a.out)
                  print(json.dumps({"state": "MASKS_ONLY", "events": n}))
          
          if __name__ == "__main__":
              main()
          FROZEN_HELPER
          cat > "$RUNNER_TEMP/n9_b4a_a2_fit_dev_gate.py" <<'FROZEN_A2'
          #!/usr/bin/env python3
          """B4-A A2: four DEV-only final F/S gate models; OOF thresholds.
          
          No G5/B4A TEST files are opened and no target-blind TEST predictions computed.
          """
          from __future__ import annotations
          import argparse, hashlib, json, math, time
          from pathlib import Path
          import joblib
          import numpy as np
          import pandas as pd
          from sklearn.ensemble import HistGradientBoostingRegressor
          from sklearn.model_selection import GroupKFold
          from frozen_gate import select_threshold
          
          N,USERS,SEED,FOLDS=50049,12628,20261012,4
          EXPECTED="37a43cb7622c708c6b1c87c3e916b0058275792654465a7b329ce2bac44bceea"
          SHARED=("hist_event_count","hist_warm_count","hist_distinct",
                  "hist_repeat_max","hist_short_unique",
                  "memory_history_supported_share","candidate_log_count")
          BASE=("base_margin","base_std","base_top_z","base_top_score","base_score_mean")
          FAMILIES=("sasrec","gru4rec")
          ARMS=("S_aligned","F_aligned")
          
          def sha(p):
              h=hashlib.sha256()
              with p.open("rb") as f:
                  for b in iter(lambda:f.read(8<<20),b""):h.update(b)
              return h.hexdigest()
          
          def reg(seed):
              return HistGradientBoostingRegressor(
                  loss="squared_error",max_iter=120,learning_rate=.05,max_depth=3,
                  min_samples_leaf=50,l2_regularization=1.0,
                  early_stopping=False,random_state=int(seed))
          
          def main(source,out):
              if out.exists():raise FileExistsError("A2 final model freeze is immutable")
              started=time.monotonic()
              meta=json.loads((source/"summary.json").read_text())
              csv=source/"dev_pair_candidate_labels.csv"
              if not(meta.get("schema")=="kbs-b1-full-dev-paired-candidate-labels-v1"
                     and meta.get("status")=="PASS"
                     and meta.get("n_dev_events")==N
                     and meta.get("test_accessed") is False
                     and meta.get("model_training") is False
                     and sha(csv)==meta.get("private_event_source_csv_sha256")==EXPECTED):
                  raise RuntimeError("DEV source B1 integrity failed")
              cols=["event_id","user_id","split","memory_ndcg10","sampled_memory_ndcg10"]
              for family in FAMILIES:
                  cols.extend((family+"_ndcg10","sampled_"+family+"_ndcg10"))
              for name in SHARED:cols.append("x_"+name)
              for family in FAMILIES:
                  for name in BASE:cols.append("x_"+family+"_"+name)
              data=pd.read_csv(csv,usecols=cols)
              if not(len(data)==N and data.event_id.is_unique
                     and data.user_id.nunique()==USERS
                     and data.split.eq("DEV").all()):
                  raise RuntimeError("DEV rows invalid")
              users=data.user_id.astype(str).to_numpy()
              folds=list(GroupKFold(n_splits=FOLDS).split(
                  np.zeros(N,dtype=np.int8),groups=users))
              for tr,va in folds:
                  if np.intersect1d(users[tr],users[va]).size:
                      raise RuntimeError("User overlap in OOF")
              result={"schema":"kbs-route-b-b4a-a2-dev-final-gates-v1",
                  "status":"DEV_ONLY_GATE_MODELS_AND_THRESHOLDS_FROZEN",
                  "n_dev_events":N,"n_dev_users":USERS,
                  "dev_source_SHA256":EXPECTED,"training_seed":SEED,
                  "group_oof_folds":FOLDS,"max_OOF_call_fraction":.30,
                  "threshold_rule":"frozen_gate.select_threshold, OOF signed gain, tied scores indivisible",
                  "model_family":"HistGradientBoostingRegressor",
                  "test_labels_or_ranking_metrics_opened":False,
                  "B4A_sample_read":False,"base_or_memory_retrained":False,
                  "models":{}}
              out.mkdir(parents=True,mode=0o700)
              modeldir=out/"private_models"
              modeldir.mkdir(mode=0o700)
              for family in FAMILIES:
                  features=["x_"+name for name in SHARED]+[
                      "x_"+family+"_"+name for name in BASE]
                  X=data[features].to_numpy(dtype=np.float64)
                  m=data.memory_ndcg10.to_numpy(dtype=np.float64)
                  sm=data.sampled_memory_ndcg10.to_numpy(dtype=np.float64)
                  true_F=data[family+"_ndcg10"].to_numpy(dtype=np.float64)
                  true_S=data["sampled_"+family+"_ndcg10"].to_numpy(dtype=np.float64)
                  targets={"S_aligned":sm-true_S,"F_aligned":m-true_F}
                  if not np.isfinite(X).all() or not all(
                          np.isfinite(yy).all() for yy in targets.values()):
                      raise RuntimeError("Nonfinite pretarget features/DEV utility")
                  result["models"][family]={}
                  oofs={}
                  for arm,y in targets.items():
                      score=np.full(N,np.nan,dtype=np.float64)
                      for k,(tr,va) in enumerate(folds):
                          model=reg(SEED+k)
                          model.fit(X[tr],y[tr])
                          score[va]=model.predict(X[va])
                      if not np.isfinite(score).all():
                          raise RuntimeError("Incomplete OOF score")
                      frozen=select_threshold(score.tolist(),y.tolist(),.30)
                      if frozen["dev_oof_call_rate"]>.3+1e-12:
                          raise RuntimeError("OOF budget violated")
                      final=reg(SEED)
                      final.fit(X,y)
                      saved=modeldir/(family+"_"+arm+"_HGB.joblib")
                      joblib.dump(final,saved,compress=3)
                      model_hash=sha(saved)
                      fitted=final.predict(X)
                      th=frozen["threshold"]
                      fitted_calls=np.zeros(N,dtype=bool) if th is None else (fitted>=th)
                      oof_calls=np.zeros(N,dtype=bool) if th is None else (score>=th)
                      if oof_calls.sum()!=frozen["calls"]:
                          raise RuntimeError("Frozen OOF threshold call mismatch")
                      diag={"label_regime":"retrospective_sampled_target_retained_DEV"
                              if arm=="S_aligned" else "full_active_DEV",
                            "label_count":N,
                            "features":features,
                            "feature_count":len(features),
                            "model_name":saved.name,
                            "model_private_SHA256":model_hash,
                            "oof_threshold":th,
                            "oof_budget":frozen,
                            "final_model_fitted_DEV_call_rate_diagnostic":float(fitted_calls.mean()),
                            "oof_DEV_full_F_NDCG_diagnostic":float(
                                np.mean(true_F+oof_calls*(m-true_F))),
                            "oof_DEV_signed_label_gain_diagnostic":float(np.mean(oof_calls*y)),
                            "regressor_training_seed":SEED,
                            "oof_user_disjoint":True,
                            "training_sample_count":N,
                            "model_hyperparameters":{"max_iter":120,"learning_rate":.05,
                                "max_depth":3,"min_samples_leaf":50,"l2_regularization":1.,
                                "early_stopping":False}}
                      result["models"][family][arm]=diag
                      oofs[arm]=oof_calls
                      print(json.dumps({"A2_DEV_MODEL":"FROZEN","family":family,"arm":arm,
                          "OOF_call_rate":diag["oof_budget"]["dev_oof_call_rate"],
                          "OOF_F_quality_diagnostic":diag["oof_DEV_full_F_NDCG_diagnostic"],
                          "frozen_model_SHA256":model_hash},sort_keys=True),flush=True)
                  result["models"][family]["OOF_decision_disagreement_fraction"]=float(
                      np.mean(oofs["S_aligned"]!=oofs["F_aligned"]))
              result["elapsed_seconds"]=round(time.monotonic()-started,2)
              (out/"summary.json").write_text(json.dumps(result,sort_keys=True,indent=2)+"\n")
              print(json.dumps({"A2_DEV":"FOUR_GATES_FROZEN","safe_summary":result},
                               sort_keys=True),flush=True)
          
          if __name__=="__main__":
              a=argparse.ArgumentParser()
              a.add_argument("--source",type=Path,required=True)
              a.add_argument("--out",type=Path,required=True)
              args=a.parse_args()
              main(args.source,args.out)
          FROZEN_A2
          export A2_SCRIPT="$RUNNER_TEMP/n9_b4a_a2_fit_dev_gate.py" A2_HELPER="$RUNNER_TEMP/frozen_gate.py"
          "$PY" - <<'SHA'
          import hashlib,os,pathlib
          for k,expected in (("A2_SCRIPT","cfd1853897fd7705a4fa0f231b5b3fde2d01d6ba"),("A2_HELPER","36016b89fcd53bfbb47629c0e04ca7d23a7c15b3")):
              raw=pathlib.Path(os.environ[k]).read_bytes()
              got=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              assert got==expected,(k,got)
          print("B4A A2 DEV scorer & original threshold rule SHA verified",flush=True)
          SHA
          "$PY" -m py_compile "$A2_SCRIPT" "$A2_HELPER"
          "$PY" "$A2_SCRIPT" \
            --source "$HOME/.cache/kuailive-agent-kbs/klm3_b1_full_dev_candidate_labels_seed20261012_v1" \
            --out "$HOME/.cache/kuailive-agent-kbs/klm3_n9_route_b_b4a_a2_dev_frozen_final_gates_v1"
