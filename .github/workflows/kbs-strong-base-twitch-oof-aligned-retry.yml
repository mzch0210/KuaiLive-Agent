name: KBS Twitch OOF-aligned strong-base retry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kbs-strong-base-twitch-oof-aligned-retry.yml'
      - 'analysis/kbs_twitch_competitive_baselines_oof_aligned.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: kuailive-gpu-3090
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: 'mzch0210/KuaiLive-Agent'
  TWITCH_ARTIFACT_ID: '10730647170'
  INPUT_RUN_ID: '35813831725'
  P12_OOF_SHA256: '9757064252c097934fa31f10a68e11bb43853ca1132aaa49da2b9794f60d3816'
  TWITCH_100K_SHA256: '11d3bdb49683f651eb6b0ba806bf317db68646efc0c7de2d02d750201fd8ef69'
  CUDA_VISIBLE_DEVICES: '0'

jobs:
  twitch:
    name: Twitch OOF-aligned retry
    if: ${{ github.repository == 'mzch0210/KuaiLive-Agent' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, linux, x64, gpu-3090]
    timeout-minutes: 900
    steps:
      - name: Enforce self-hosted runner guardrails
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(id -u)" -ne 0
          if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then exit 1; fi
          if id -nG | tr ' ' '\n' | grep -qx docker; then exit 1; fi
          test -z "${SSH_AUTH_SOCK:-}"

      - name: Verify RTX 3090 runtime
        shell: bash
        run: |
          set -euo pipefail
          PY="$HOME/venvs/kuailive-gpu/bin/python"
          test -x "$PY"
          "$PY" - <<'PY'
          import numpy, pandas, torch
          assert torch.__version__.startswith('2.4.1'), torch.__version__
          assert torch.cuda.is_available()
          assert 'RTX 3090' in torch.cuda.get_device_name(0)
          print(numpy.__version__, pandas.__version__, torch.__version__, torch.cuda.get_device_name(0))
          PY
          echo "PY=$PY" >> "$GITHUB_ENV"

      - name: Checkout aligned benchmark controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Compile aligned benchmark controller
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/analysis:$GITHUB_WORKSPACE/src"
          echo "PYTHONPATH=$PYTHONPATH" >> "$GITHUB_ENV"
          "$PY" -m py_compile \
            analysis/kbs_twitch_competitive_baselines.py \
            analysis/kbs_twitch_competitive_baselines_oof_aligned.py

      - name: Check persistent Twitch input cache
        id: cache
        shell: bash
        run: |
          set -euo pipefail
          CACHE="$HOME/.cache/kuailive-agent-kbs/twitch-$TWITCH_ARTIFACT_ID"
          echo "path=$CACHE" >> "$GITHUB_OUTPUT"
          if [ -f "$CACHE/.verified" ]; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            mkdir -p "$CACHE"
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Twitch input only if persistent cache is absent
        if: ${{ steps.cache.outputs.hit != 'true' }}
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          artifact-ids: ${{ env.TWITCH_ARTIFACT_ID }}
          path: twitch_download
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.INPUT_RUN_ID }}

      - name: Verify Twitch cache
        shell: bash
        env:
          CACHE_PATH: ${{ steps.cache.outputs.path }}
          CACHE_HIT: ${{ steps.cache.outputs.hit }}
        run: |
          set -euo pipefail
          if [ "$CACHE_HIT" != 'true' ]; then
            cp -a twitch_download/. "$CACHE_PATH/"
          fi
          test -s "$CACHE_PATH/frozen_p12/p1_2_dev_oof_predictions.csv.gz"
          test -s "$CACHE_PATH/twitch_data/100k.csv"
          (cd "$CACHE_PATH" && sha256sum -c SHA256SUMS)
          echo "$P12_OOF_SHA256  $CACHE_PATH/frozen_p12/p1_2_dev_oof_predictions.csv.gz" | sha256sum -c -
          echo "$TWITCH_100K_SHA256  $CACHE_PATH/twitch_data/100k.csv" | sha256sum -c -
          touch "$CACHE_PATH/.verified"
          echo "TWITCH_INPUT=$CACHE_PATH" >> "$GITHUB_ENV"
          rm -rf twitch_download

      - name: Run OOF-aligned Twitch DEV-only competitiveness benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark_results/twitch
          "$PY" analysis/kbs_twitch_competitive_baselines_oof_aligned.py \
            --twitch-csv "$TWITCH_INPUT/twitch_data/100k.csv" \
            --official-oof "$TWITCH_INPUT/frozen_p12/p1_2_dev_oof_predictions.csv.gz" \
            --out-dir benchmark_results/twitch --seed 42 --seq-len 16 --epochs 5

      - name: Validate aligned Twitch output
        shell: bash
        run: |
          set -euo pipefail
          "$PY" - <<'PY'
          import json, pandas as pd
          t=pd.read_csv('benchmark_results/twitch/twitch_dev_strong_base_benchmark.csv')
          assert {'Popularity','GRU4Rec-small','SASRec-small','Official LiveRec Base'} <= set(t.model)
          r=json.load(open('benchmark_results/twitch/twitch_dev_strong_base_benchmark.json'))
          assert r['test_ranking_inspected'] is False
          assert r['event_reconstruction_exact_match'] is True
          assert 'frozen P1.2 OOF' in r['event_alignment']
          print(t.to_string(index=False))
          print(json.dumps(r, indent=2))
          PY

      - name: Upload immutable Twitch benchmark result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kbs-strong-base-twitch-oof-aligned-${{ github.run_id }}
          path: benchmark_results/twitch/
          if-no-files-found: warn
          retention-days: 90

      - name: Cleanup transient workspace only
        if: always()
        shell: bash
        run: |
          rm -rf benchmark_results twitch_download
