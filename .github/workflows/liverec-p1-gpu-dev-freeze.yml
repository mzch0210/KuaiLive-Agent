name: LiveRec Twitch P1 GPU dev freeze

on:
  workflow_dispatch:
    inputs:
      confirm_owner_run:
        description: 'Run the frozen P1 dev-only protocol on the private RTX 3090 runner'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: kuailive-gpu-3090
  cancel-in-progress: false

env:
  LIVEREC_OFFICIAL_COMMIT: '27eaf33d258d1c1ea2d6da1da81a5360e8c8ce6b'
  TWITCH_100K_URL: 'https://mcauleylab.ucsd.edu/public_datasets/gdrive/twitch/100k_a.csv'
  EXPECTED_REPOSITORY: 'mzch0210/KuaiLive-Agent'
  EXPECTED_ACTOR: 'mzch0210'
  PYTHONHASHSEED: '42'
  CUDA_VISIBLE_DEVICES: '0'
  CUBLAS_WORKSPACE_CONFIG: ':4096:8'

jobs:
  train-dev-freeze:
    if: ${{ github.actor == 'mzch0210' && github.ref == 'refs/heads/main' && inputs.confirm_owner_run }}
    runs-on: [self-hosted, linux, x64, gpu-3090]
    timeout-minutes: 1440
    steps:
      - name: Enforce self-hosted runner guardrails
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_ACTOR" = "$EXPECTED_ACTOR"
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(id -u)" -ne 0

          if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            echo 'ERROR: runner user has passwordless sudo.' >&2
            exit 1
          fi
          if id -nG | tr ' ' '\n' | grep -qx docker; then
            echo 'ERROR: runner user is in the docker group.' >&2
            exit 1
          fi
          if [ -n "${SSH_AUTH_SOCK:-}" ]; then
            echo 'ERROR: SSH agent forwarding is visible to the runner.' >&2
            exit 1
          fi
          for d in "$HOME/.aws" "$HOME/.azure" "$HOME/.config/gcloud"; do
            test ! -e "$d" || { echo "ERROR: credential directory present: $d" >&2; exit 1; }
          done

      - name: Verify frozen GPU runtime
        shell: bash
        run: |
          set -euo pipefail
          command -v nvidia-smi
          PY="$HOME/venvs/kuailive-gpu/bin/python"
          test -x "$PY"
          "$PY" - <<'PY'
          import torch
          assert torch.__version__.startswith('2.4.1'), torch.__version__
          assert torch.cuda.is_available(), 'CUDA unavailable'
          name = torch.cuda.get_device_name(0)
          assert 'RTX 3090' in name, name
          print('torch=', torch.__version__)
          print('cuda_build=', torch.version.cuda)
          print('gpu=', name)
          PY

      - name: Checkout frozen experiment controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Prepare clean experiment workspace
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test "$PWD" = "$GITHUB_WORKSPACE"
          rm -rf third_party/liverec liverec_p1_gpu
          mkdir -p third_party/liverec liverec_p1_gpu/models liverec_p1_gpu/cache

      - name: Fetch pinned official LiveRec source
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/third_party/liverec"
          git init -q
          git remote add origin https://github.com/JRappaz/liverec.git
          git fetch --depth=1 origin "$LIVEREC_OFFICIAL_COMMIT"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$LIVEREC_OFFICIAL_COMMIT"
          cp "$GITHUB_WORKSPACE/analysis/liverec_p1_train_dev_only.py" p1_train_dev_only.py
          "$HOME/venvs/kuailive-gpu/bin/python" -m py_compile p1_train_dev_only.py

      - name: Download official Twitch 100k benchmark mirror
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/third_party/liverec/dataset"
          curl -L --fail --retry 3 --retry-delay 3 \
            "$TWITCH_100K_URL" \
            -o "$GITHUB_WORKSPACE/third_party/liverec/dataset/100k.csv"
          test -s "$GITHUB_WORKSPACE/third_party/liverec/dataset/100k.csv"
          sha256sum "$GITHUB_WORKSPACE/third_party/liverec/dataset/100k.csv" | tee "$GITHUB_WORKSPACE/liverec_p1_gpu/twitch100k.sha256"

      - name: Capture hardware evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "repository_sha=$GITHUB_SHA"
            echo "official_liverec_commit=$LIVEREC_OFFICIAL_COMMIT"
            echo "runner_user=$(id -un)"
            nvidia-smi --query-gpu=name,driver_version,memory.total,pci.bus_id --format=csv,noheader
          } | tee "$GITHUB_WORKSPACE/liverec_p1_gpu/hardware.txt"
          "$HOME/venvs/kuailive-gpu/bin/python" -m pip freeze | sort > "$GITHUB_WORKSPACE/liverec_p1_gpu/pip-freeze.txt"

      - name: Train official LiveRec and freeze by dev only on RTX 3090
        shell: bash
        working-directory: third_party/liverec
        env:
          LIVEREC_REPORT: '${{ github.workspace }}/liverec_p1_gpu/p1_base_dev_freeze.json'
        run: |
          set -euo pipefail
          "$HOME/venvs/kuailive-gpu/bin/python" p1_train_dev_only.py \
            --model=LiveRec \
            --dataset='dataset/' \
            --fr_ctx \
            --fr_rep \
            --model_to='liverec_p1_gpu' \
            --device='cuda' \
            --caching \
            --model_path='${{ github.workspace }}/liverec_p1_gpu/models' \
            --cache_dir='${{ github.workspace }}/liverec_p1_gpu/cache' \
            --seed=42 \
            --lr=0.0005 \
            --l2=0.1 \
            --batch_size=100 \
            --seq_len=16 \
            --dim=64 \
            --num_att=2 \
            --num_att_ctx=2 \
            --num_heads=4 \
            --num_heads_ctx=4 \
            --topk_att=64 \
            --early_stop=15 \
            --num_epochs=150 | tee '${{ github.workspace }}/liverec_p1_gpu/train.log'

      - name: Validate untouched-test and GPU guardrails
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/venvs/kuailive-gpu/bin/python" - <<'PY'
          import json
          from pathlib import Path
          p = Path('liverec_p1_gpu/p1_base_dev_freeze.json')
          r = json.loads(p.read_text())
          assert r['official_commit'] == '27eaf33d258d1c1ea2d6da1da81a5360e8c8ce6b'
          assert r['test_ranking_inspected'] is False
          assert r['config']['fr_ctx'] is True and r['config']['fr_rep'] is True
          assert r['config']['device'].startswith('cuda')
          assert r['runtime']['cuda_available'] is True
          assert 'RTX 3090' in r['runtime']['gpu_name']
          assert r['data']['users'] == 100000
          assert r['data']['streamers'] == 162625
          assert r['data']['rows'] == 3051733
          print(json.dumps(r, indent=2))
          PY

      - name: Upload frozen GPU dev checkpoint and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: liverec-p1-gpu-dev-freeze-${{ github.run_id }}
          path: |
            liverec_p1_gpu/p1_base_dev_freeze.json
            liverec_p1_gpu/train.log
            liverec_p1_gpu/hardware.txt
            liverec_p1_gpu/pip-freeze.txt
            liverec_p1_gpu/twitch100k.sha256
            liverec_p1_gpu/models/**
          if-no-files-found: warn
          retention-days: 60

      - name: Remove residual dataset and caches from persistent runner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/third_party/liverec/dataset" "$GITHUB_WORKSPACE/liverec_p1_gpu/cache"
