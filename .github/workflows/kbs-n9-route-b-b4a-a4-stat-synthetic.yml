name: KBS B4-A A4 prereveal statistical math synthetic tests
on:
  push:
    branches: [kbs-b4a-a3-synthetic-preflight-20261014]
    paths:
      - '.github/workflows/kbs-n9-route-b-b4a-a4-stat-synthetic.yml'
  pull_request:
    branches: [main]
    paths:
      - 'analysis/kbs_plan_c/n9_b4a_a4_weighted_stat_contract.py'
      - 'analysis/kbs_plan_c/test_n9_b4a_a4_weighted_stat_contract.py'
      - '.github/workflows/kbs-n9-route-b-b4a-a4-stat-synthetic.yml'
permissions:
  contents: read
jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --quiet numpy==2.1.3
      - name: Test only hypothetical NDCGs, no TEST data
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s analysis/kbs_plan_c -p test_n9_b4a_a4_weighted_stat_contract.py -v
          python -m py_compile analysis/kbs_plan_c/n9_b4a_a4_weighted_stat_contract.py
          echo 'A4 statistical formula dry-run PASS, no target labels were opened'
