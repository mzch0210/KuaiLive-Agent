name: KBS Plan C DEV budget matched random and oracle controls
on:
  push:
    branches: [main]
    paths: ['.github/workflows/kbs-plan-c-g3-budget-controls.yml']
permissions:
  contents: read
jobs:
  hosted-validate:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'authorize Plan C DEV budget controls')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false, clean: true}
      - name: Verify DEV-only code and package hash
        run: |
          set -euo pipefail
          python -m py_compile analysis/kbs_plan_c/g3_budget_controls_dev.py
          mkdir -p g3-budget-code
          cp analysis/kbs_plan_c/g3_budget_controls_dev.py g3-budget-code/
          (cd g3-budget-code && sha256sum *.py > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/cache/save@v4
        with:
          key: kbs-plan-c-g3-budget-controls-dev-v1
          path: g3-budget-code/
  user-host-budget-controls:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'authorize Plan C DEV budget controls')
    needs: hosted-validate
    runs-on: [self-hosted, linux, x64, gpu-3090]
    timeout-minutes: 25
    concurrency:
      group: kuailive-gpu-3090
      cancel-in-progress: false
    steps:
      - name: Require sealed TEST, unchanged E2 DEV and valid Python
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = mzch0210/KuaiLive-Agent
          test "$GITHUB_REF" = refs/heads/main
          test -s "$HOME/.cache/kuailive-agent-kbs/klm3_g3_e2_five_gate_DEV_frozen_v1/aggregate.json"
          test -x "$HOME/venvs/kuailive-gpu/bin/python"
      - uses: actions/cache/restore@v4
        with:
          key: kbs-plan-c-g3-budget-controls-dev-v1
          path: g3-budget-code/
          fail-on-cache-miss: true
      - name: Compute DEV reference random and hindsight oracle under fixed budgets
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          (cd g3-budget-code && sha256sum -c SHA256SUMS)
          export PYTHONPATH="$HOME/.cache/kuailive-agent-kbs/e2-py312-sklearn-v1:$HOME/.cache/kuailive-agent-kbs/audit-py312-tools-v1"
          export OPENBLAS_NUM_THREADS=1
          export OMP_NUM_THREADS=1
          export PYTHONUNBUFFERED=1
          ROOT="$HOME/.cache/kuailive-agent-kbs"
          "$HOME/venvs/kuailive-gpu/bin/python" \
            g3-budget-code/g3_budget_controls_dev.py \
            --e2 "$ROOT/klm3_g3_e2_five_gate_DEV_frozen_v1" \
            --out "$ROOT/klm3_g3_budget_controls_dev_v1.json"
          mkdir -p budget-report
          cp "$ROOT/klm3_g3_budget_controls_dev_v1.json" budget-report/aggregate.json
          "$HOME/venvs/kuailive-gpu/bin/python" - <<'PY'
          import json
          d=json.load(open('budget-report/aggregate.json'))
          assert d['schema']=='kbs-plan-c-e2-dev-budget-matched-v1'
          assert not d['test_data_read'] and not d['test_metric_computed']
          assert set(d['family'])=={'sasrec','gru4rec'}
          for f,a in d['family'].items():
              assert a['n_events']==50049
              for x in a['budget_curve']:
                  assert x['oracle_hindsight_at_most_k_ndcg10'] >= x['random_exact_k_expected_ndcg10']-1e-10
                  assert x['oracle_hindsight_at_most_k_ndcg10'] >= a['baseline_ndcg10']-1e-10
          print('DEV budget controls pass; no TEST data touched.')
          PY
      - name: Upload only paired budget aggregate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kbs-plan-c-g3-dev-budget-oracle-random
          path: budget-report/aggregate.json
          retention-days: 21
