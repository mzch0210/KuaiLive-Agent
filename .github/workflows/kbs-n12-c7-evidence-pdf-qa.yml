name: KBS N12 C7 bounded scientific claims, manuscript and dual PDF QA
# C7 verifies migrated tables cell by cell and retains C6 science/PDF QA.
on:
  push:
    branches: [kbs-n12-single-thesis-restructure-plan-20261014]
    paths:
      - 'manuscript/kbs_latex/main.tex'
      - 'manuscript/kbs_latex/Highlights.txt'
      - 'manuscript/kbs_latex/SUPPLEMENTARY_INFORMATION_S1-S10_2026-10-13.md'
      - 'analysis/kbs_plan_c/n12_c7_full_table_cell_audit.py'
      - 'analysis/kbs_plan_c/test_n12_c7_full_table_cell_audit.py'
      - 'analysis/kbs_plan_c/n12_c6_scientific_contract.py'
      - '.github/workflows/kbs-n12-c7-evidence-pdf-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kbs-n12-c7-scientific-pdfs
  cancel-in-progress: true
jobs:
  main-paper:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: N12 C7 bounded-claims and frozen scientific result audit
        run: |
          set -euo pipefail
          python analysis/kbs_plan_c/n12_c6_scientific_contract.py
          python analysis/kbs_plan_c/n12_c7_full_table_cell_audit.py --output /tmp/n12-c7-cell-provenance.json
          python -m unittest discover -s analysis/kbs_plan_c -p 'test_n12_c7_full_table_cell_audit.py' -v
      - name: Main and S10 cross source consistency
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          main=Path('manuscript/kbs_latex/main.tex').read_text()
          supp=Path('manuscript/kbs_latex/SUPPLEMENTARY_INFORMATION_S1-S10_2026-10-13.md').read_text()
          assert 'S10.15' in main and 'S10.16' in main
          assert 'tab:results-m3-additional-relation-identity' in main
          assert 'tab:results-m3-dev-relation-identity' not in main
          assert 'B4-A' not in main and 'G5' not in main
          assert 'S10.17' in main and 'S10.18' in main
          assert '\\cite{zhong2026samd}' in main
          assert 'fig:knowledge-value-chain' in main
          assert '\\section{Knowledge Valuation and Selective Use}' in main
          assert '\\section{Experimental Design}' in main
          assert '\\section{Experimental Setup}' not in main
          assert '\\section{Results}' in main
          assert '\\section{Experimental Results}' not in main
          for h in ['RQ1: When Is Relationship Knowledge', 'RQ2: Does Candidate-Aligned Value',
                    'How Supervision Reallocates Historical Knowledge Calls',
                    'Frozen Base-Relative Selection Across Tasks and Incumbents',
                    'RQ3: Does Authentic Relationship History', 'Operational Conditions: Invocation']:
              assert h in main
          assert 'S10.19' in supp
          for label in ['Table S10.13.', 'Table S10.14.', 'Table S10.15.', 'Table S10.16.']:
              assert label in supp, label
          assert 'Ranking Tasks and Evidence Hierarchy' in main
          assert 'Additional-Target Freeze and Prespecified Comparisons' in main
          assert '\\section{Problem Formulation}' not in main
          assert '\\section{Base-Relative Evidence Valuation Framework}' not in main
          for label in ('eq:memory-scoring','eq:delta-memory','eq:eta','eq:diagnostic-states'):
              assert '\\label{' + label + '}' in main
          assert 'RQ1: Define the value' in main and 'RQ2: Predict value' in main and 'RQ3: Verify the history source' in main
          assert 'Our study does not require a new generic deferral theorem' not in main
          assert 'tab:results-n10-cost' in main
          assert 'tab:results-m3-b4a-supervision' in main
          for v in ['0.005391','0.003585','0.031145','0.334942']:
              assert v in main and v in supp,v
          for v in ['S10.15','S10.16','S10.17','S10.18','Table S10.9','Table S10.10','Table S10.11','Table S10.12','NOT VERIFIED','1.337','1.797']:
              assert v in supp,v
          sections=[int(s) for s in re.findall(r'^# S(10|[1-9])\.',supp,re.M)]
          assert sections==list(range(1,11)),sections
          secs=[int(s) for s in re.findall(r'^## S10\.(\d+) ',supp,re.M)]
          assert secs==list(range(1,20)),secs
          bib=Path('manuscript/kbs_latex/kbs_references.bib').read_text()
          assert '@article{zhong2026samd,' in bib
          for number in ('0.692','1.769','0.334942'):
              assert number in main, number
          for number in ('0.69165','1.76941','0.021867'):
              assert number in supp, number
          print('N12 C7 four-RQ Results, frozen primary tables and S10.19 migrated controls PASS')
          PY
      - name: Install PDF extraction for manuscript QA
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Compile updated LaTeX paper
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: manuscript/kbs_latex
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Verify current main manuscript PDF
        run: |
          set -euo pipefail
          test -s manuscript/kbs_latex/main.pdf
          pdftotext -layout manuscript/kbs_latex/main.pdf main-n12c7.txt
          grep -F '0.005391' main-n12c7.txt
          grep -F '0.031145' main-n12c7.txt
          grep -F '0.334942' main-n12c7.txt
          grep -F 'Authentic Full Memory' main-n12c7.txt
          grep -F 'RQ1: Define the value' main-n12c7.txt
          grep -F 'Knowledge Valuation and Selective Use' main-n12c7.txt
          grep -F 'Experimental Design' main-n12c7.txt
          grep -F 'RQ1: When Is Relationship Knowledge' main-n12c7.txt
          grep -F 'RQ2: Does Candidate-Aligned Value' main-n12c7.txt
          grep -F 'RQ3: Does Authentic Relationship History' main-n12c7.txt
          grep -F '30,000' main-n12c7.txt
          grep -F '4,096' main-n12c7.txt
          grep -F '0.692' main-n12c7.txt
          grep -F '1.769' main-n12c7.txt
          python - <<'PY'
          from pathlib import Path
          s=Path('manuscript/kbs_latex/main.log').read_text(errors='replace')
          assert not any(e in s for e in ['! LaTeX Error:','! Undefined control sequence.','Missing $ inserted.','Emergency stop','Fatal error occurred','There were undefined references'])
          assert 'Overfull \\hbox' not in s, 'Manuscript PDF has overfull text'
          print('N12 C7 MAIN PDF zero-overfull PASS')
          PY
      - name: Archive revised manuscript PDF
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kbs-n12-c7-main
          path: |
            manuscript/kbs_latex/main.pdf
            manuscript/kbs_latex/main.log
            manuscript/kbs_latex/main.blg
          if-no-files-found: warn
          retention-days: 60
  complete-supplement:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Install pandoc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc poppler-utils
      - name: Convert and postprocess S1-S10.18 Markdown
        run: |
          set -euo pipefail
          cd manuscript/kbs_latex
          pandoc SUPPLEMENTARY_INFORMATION_S1-S10_2026-10-13.md \
            -f markdown+pipe_tables+raw_tex+tex_math_dollars+yaml_metadata_block \
            -t latex -s --toc --toc-depth=1 \
            -V documentclass=article -V fontsize=10pt \
            -V mainfont='DejaVu Serif' -V sansfont='DejaVu Sans' -V monofont='DejaVu Sans Mono' \
            -V geometry:margin=0.75in -V colorlinks=true -V urlcolor=blue \
            --pdf-engine=xelatex -o supplementary_information_n9.tex
          cd ../..
          python analysis/kbs_n9_supplement_tex_postprocess.py manuscript/kbs_latex/supplementary_information_n9.tex
          test -s manuscript/kbs_latex/supplementary_information_n9.tex
      - name: Compile revised S1-S10.18 PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: supplementary_information_n9.tex
          working_directory: manuscript/kbs_latex
          args: -pdfxe -file-line-error -halt-on-error -interaction=nonstopmode
      - name: Validate supplement PDF
        run: |
          set -euo pipefail
          test -s manuscript/kbs_latex/supplementary_information_n9.pdf
          pdftotext -layout manuscript/kbs_latex/supplementary_information_n9.pdf supp-n12c7.txt
          grep -F '0.005391' supp-n12c7.txt
          grep -F '0.031145' supp-n12c7.txt
          grep -F 'S10.15' supp-n12c7.txt
          grep -F 'S10.16' supp-n12c7.txt
          grep -F 'S10.17' supp-n12c7.txt
          grep -F 'S10.18' supp-n12c7.txt
          grep -F 'S10.19' supp-n12c7.txt
          grep -F 'Table S10.13.' supp-n12c7.txt
          grep -F 'Table S10.16.' supp-n12c7.txt
          grep -F '0.69165' supp-n12c7.txt
          grep -F '0.021867' supp-n12c7.txt
          python - <<'PY'
          from pathlib import Path
          s=Path('manuscript/kbs_latex/supplementary_information_n9.log').read_text(errors='replace')
          assert not any(e in s for e in ['! LaTeX Error:','! Undefined control sequence.','Missing $ inserted.','Emergency stop','Fatal error occurred'])
          assert 'Overfull \\hbox' not in s, 'Supplement PDF has overfull text'
          print('S10.1-S10.19 supplement zero-overfull PASS')
          PY
      - name: Archive revised supplement PDF
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kbs-n12-c7-supplement
          path: |
            manuscript/kbs_latex/supplementary_information_n9.pdf
            manuscript/kbs_latex/supplementary_information_n9.tex
            manuscript/kbs_latex/supplementary_information_n9.log
          if-no-files-found: warn
          retention-days: 60
