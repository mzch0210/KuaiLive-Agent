name: LiveRec Twitch P1.3 one-shot untouched test (hardened)

on:
  workflow_dispatch:
    inputs:
      confirm_one_shot_test:
        description: 'I confirm P1.3 is the one-shot untouched test; no rescue tuning after inspection'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: kuailive-gpu-3090
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: 'mzch0210/KuaiLive-Agent'
  EXPECTED_ACTOR: 'mzch0210'
  LIVEREC_OFFICIAL_COMMIT: '27eaf33d258d1c1ea2d6da1da81a5360e8c8ce6b'
  LIVEREC_SOURCE_SHA256: '243ac4f01c408b71e4b87b06e58300b41286c5988b7a71c01a4fa04899072d48'
  TWITCH_100K_URL: 'https://mcauleylab.ucsd.edu/public_datasets/gdrive/twitch/100k_a.csv'
  TWITCH_100K_SHA256: '11d3bdb49683f651eb6b0ba806bf317db68646efc0c7de2d02d750201fd8ef69'
  FROZEN_BASE_ARTIFACT_ID: '10678092592'
  FROZEN_BASE_RUN_ID: '35679482824'
  FROZEN_BASE_REPORT_SHA256: '6f7b8ed63553b94c0b49bb1416213f7b1b5d0ac694d662aaef3176bbf3e5a021'
  FROZEN_BASE_CHECKPOINT_SHA256: '282b07277cf8a213f58094c7170f9d43fb988926ad554d8cd315aabfe736b6da'
  FROZEN_BASE_CHECKPOINT_REL: 'models/liverec_p1_gpu_64_0.1_64_2_16_rep_ctx.pt'
  FROZEN_P1_2_ARTIFACT_ID: '10680854557'
  FROZEN_P1_2_RUN_ID: '35698158121'
  P1_2_GATE_REPORT_SHA256: 'b095b46eb6d9ce673d20edd3e86ef49759b2eb923d62f3b19520581727b21492'
  P1_2_OOF_SHA256: '9757064252c097934fa31f10a68e11bb43853ca1132aaa49da2b9794f60d3816'
  P1_2_UTILITY_GATE_SHA256: '33ed1511c2f9447695ed34fd89037da903df8b9a86d763261d6240e623562fc0'
  P1_2_STATE_ECDF_SHA256: 'b5921df7f821240c687958ba1d2d5d3a77d2ac8b5d6594b8f9fd4b09900ce70e'
  P1_2_DEV_SUMMARY_SHA256: '8880e58fede742fe6b5b2d8bc46b1d37128f33932a03da621510b9943c734850'
  PYTHONHASHSEED: '42'
  CUDA_VISIBLE_DEVICES: '0'
  CUBLAS_WORKSPACE_CONFIG: ':4096:8'

jobs:
  freeze-policy-preflight:
    if: ${{ github.actor == 'mzch0210' && github.ref == 'refs/heads/main' && inputs.confirm_one_shot_test }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - name: Checkout frozen P1.3 controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Refuse any prior test opening or result artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          prefixes=(
              'liverec-p1-3-test-opened-',
              'liverec-p1-3-test-export-',
              'liverec-p1-3-test-final-',
          )
          found=[]
          for page in range(1, 21):
              req=urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/actions/artifacts?per_page=100&page={page}',
                  headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},
              )
              with urllib.request.urlopen(req, timeout=30) as resp: payload=json.load(resp)
              arts=payload.get('artifacts', [])
              for a in arts:
                  if not a.get('expired',False) and str(a.get('name','')).startswith(prefixes):
                      found.append((a.get('id'),a.get('name'),a.get('created_at')))
              if len(arts)<100: break
          if found:
              raise SystemExit(f'ERROR: P1.3 test was already opened or produced evidence; one-shot rerun refused: {found}')
          print('repository one-shot guard: clear')
          PY

      - name: Download frozen P1.2 evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          artifact-ids: ${{ env.FROZEN_P1_2_ARTIFACT_ID }}
          path: frozen_p1_2
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.FROZEN_P1_2_RUN_ID }}

      - name: Verify frozen P1.2 evidence hashes and protocol
        shell: bash
        run: |
          set -euo pipefail
          echo "$P1_2_GATE_REPORT_SHA256  frozen_p1_2/gate_freeze/p1_2_dev_gate_report.json" | sha256sum -c -
          echo "$P1_2_OOF_SHA256  frozen_p1_2/gate_freeze/p1_2_dev_oof_predictions.csv.gz" | sha256sum -c -
          echo "$P1_2_UTILITY_GATE_SHA256  frozen_p1_2/gate_freeze/p1_2_frozen_utility_gate.joblib" | sha256sum -c -
          echo "$P1_2_STATE_ECDF_SHA256  frozen_p1_2/dev_export/p1_2_state_ecdf.json" | sha256sum -c -
          echo "$P1_2_DEV_SUMMARY_SHA256  frozen_p1_2/dev_export/p1_2_dev_export_summary.json" | sha256sum -c -
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('frozen_p1_2/gate_freeze/p1_2_dev_gate_report.json').read_text())
          s=json.loads(Path('frozen_p1_2/dev_export/p1_2_dev_export_summary.json').read_text())
          assert r['test_ranking_inspected'] is False and s['test_ranking_inspected'] is False
          assert r['utility_router']['k']==r['difficulty_router_exact_k']['k']==6563
          assert abs(r['utility_router']['threshold']-0.004734357474290205)<1e-15
          assert 'Do not alter' in r['freeze_rule']
          PY

      - name: Install exact frozen analysis runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            'numpy==1.26.4' 'pandas==2.3.3' 'scipy==1.17.1' \
            'scikit-learn==1.5.2' 'joblib==1.4.2' 'threadpoolctl==3.7.0'
          python -m py_compile analysis/liverec_p1_complete_policy_freeze.py analysis/liverec_p1_test_evaluate.py

      - name: Complete frozen policy package without test access
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p liverec_p1_3/policy
          python analysis/liverec_p1_complete_policy_freeze.py \
            --dev-oof frozen_p1_2/gate_freeze/p1_2_dev_oof_predictions.csv.gz \
            --utility-gate frozen_p1_2/gate_freeze/p1_2_frozen_utility_gate.joblib \
            --gate-report frozen_p1_2/gate_freeze/p1_2_dev_gate_report.json \
            --state-ecdf frozen_p1_2/dev_export/p1_2_state_ecdf.json \
            --out-dir liverec_p1_3/policy
          cp frozen_p1_2/gate_freeze/p1_2_frozen_utility_gate.joblib liverec_p1_3/policy/
          cp frozen_p1_2/gate_freeze/p1_2_dev_gate_report.json liverec_p1_3/policy/
          cp frozen_p1_2/gate_freeze/p1_2_dev_oof_predictions.csv.gz liverec_p1_3/policy/
          cp frozen_p1_2/dev_export/p1_2_state_ecdf.json liverec_p1_3/policy/
          cp frozen_p1_2/dev_export/p1_2_dev_export_summary.json liverec_p1_3/policy/
          cd liverec_p1_3/policy
          sha256sum p1_3_policy_manifest.json p1_2_frozen_utility_gate.joblib \
            p1_2_frozen_difficulty_gate.joblib p1_2_dev_gate_report.json \
            p1_2_dev_oof_predictions.csv.gz p1_2_state_ecdf.json p1_2_dev_export_summary.json > SHA256SUMS

      - name: Validate frozen policy package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('liverec_p1_3/policy/p1_3_policy_manifest.json').read_text())
          assert r['test_ranking_inspected'] is False
          assert r['utility_rule']['dev_invocation_k']==6563
          assert abs(r['utility_rule']['threshold']-0.004734357474290205)<1e-15
          assert len(r['utility_strata']['internal_cutpoints'])==9
          assert max(r['state_transform']['dev_replay_max_abs_error'].values())<=1e-12
          assert r['memory_rule']['unchanged_from_p1_2'] is True
          assert 'one-shot' in r['freeze_rule'].lower()
          PY

      - name: Upload immutable P1.3 policy bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: liverec-p1-3-policy-${{ github.run_id }}
          path: liverec_p1_3/policy/
          if-no-files-found: error
          retention-days: 90

  export-untouched-test:
    needs: freeze-policy-preflight
    if: ${{ needs.freeze-policy-preflight.result == 'success' }}
    runs-on: [self-hosted, linux, x64, gpu-3090]
    timeout-minutes: 120
    steps:
      - name: Enforce self-hosted runner guardrails
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_ACTOR" = "$EXPECTED_ACTOR"
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(id -u)" -ne 0
          if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then echo 'ERROR: passwordless sudo' >&2; exit 1; fi
          if id -nG | tr ' ' '\n' | grep -qx docker; then echo 'ERROR: docker group' >&2; exit 1; fi
          test -z "${SSH_AUTH_SOCK:-}" || { echo 'ERROR: SSH agent visible' >&2; exit 1; }
          for d in "$HOME/.aws" "$HOME/.azure" "$HOME/.config/gcloud"; do test ! -e "$d" || { echo "ERROR: credential directory $d" >&2; exit 1; }; done
          if [ -d "$HOME/.ssh" ] && find "$HOME/.ssh" -maxdepth 1 -type f \( -name 'id_rsa' -o -name 'id_ed25519' -o -name 'id_ecdsa' -o -name 'id_dsa' \) | grep -q .; then echo 'ERROR: SSH private key present' >&2; exit 1; fi

      - name: Verify frozen GPU runtime
        shell: bash
        run: |
          set -euo pipefail
          PY="$HOME/venvs/kuailive-gpu/bin/python"; test -x "$PY"
          "$PY" - <<'PY'
          import torch
          assert torch.__version__.startswith('2.4.1')
          assert torch.cuda.is_available() and 'RTX 3090' in torch.cuda.get_device_name(0)
          print(torch.__version__, torch.version.cuda, torch.cuda.get_device_name(0))
          PY

      - name: Checkout same frozen P1.3 controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Verify local one-shot sentinel is clear
        shell: bash
        run: |
          set -euo pipefail
          SENT="$HOME/.cache/kuailive-one-shot/liverec-p1-3-test.json"
          if [ -e "$SENT" ]; then echo 'ERROR: local one-shot sentinel already exists:' >&2; cat "$SENT" >&2; exit 1; fi

      - name: Prepare clean workspace and verified source/data caches
        shell: bash
        run: |
          set -euo pipefail
          rm -rf third_party/liverec frozen_p1_base liverec_p1_3/policy liverec_p1_3/dev_replay liverec_p1_3/test_export liverec_p1_3/test_opened
          mkdir -p third_party/liverec frozen_p1_base liverec_p1_3/policy liverec_p1_3/dev_replay liverec_p1_3/test_export liverec_p1_3/test_opened
          CACHE_ROOT="$HOME/.cache/kuailive-public/liverec"; mkdir -p "$CACHE_ROOT/source" "$CACHE_ROOT/data" "$CACHE_ROOT/preprocessed"
          SRC_TGZ="$CACHE_ROOT/source/liverec-${LIVEREC_OFFICIAL_COMMIT}.tar.gz"
          if [ ! -s "$SRC_TGZ" ] || [ "$(sha256sum "$SRC_TGZ" | awk '{print $1}')" != "$LIVEREC_SOURCE_SHA256" ]; then
            rm -f "$SRC_TGZ"; curl --proto '=https' --tlsv1.2 -L --fail --retry 3 --retry-delay 3 "https://codeload.github.com/JRappaz/liverec/tar.gz/${LIVEREC_OFFICIAL_COMMIT}" -o "$SRC_TGZ"
          fi
          echo "$LIVEREC_SOURCE_SHA256  $SRC_TGZ" | sha256sum -c -
          tar -xzf "$SRC_TGZ" --strip-components=1 -C third_party/liverec
          DATA="$CACHE_ROOT/data/twitch100k-${TWITCH_100K_SHA256}.csv"
          if [ ! -s "$DATA" ] || [ "$(sha256sum "$DATA" | awk '{print $1}')" != "$TWITCH_100K_SHA256" ]; then
            rm -f "$DATA"; curl --proto '=https' --tlsv1.2 -L --fail --retry 3 --retry-delay 3 "$TWITCH_100K_URL" -o "$DATA"
          fi
          echo "$TWITCH_100K_SHA256  $DATA" | sha256sum -c -
          mkdir -p third_party/liverec/dataset; ln -s "$DATA" third_party/liverec/dataset/100k.csv
          cp analysis/liverec_p1_dev_memory_export.py third_party/liverec/p1_dev_memory_export.py
          cp analysis/liverec_p1_test_export.py third_party/liverec/p1_test_export.py
          "$HOME/venvs/kuailive-gpu/bin/python" -m py_compile third_party/liverec/p1_dev_memory_export.py third_party/liverec/p1_test_export.py third_party/liverec/arguments.py third_party/liverec/data.py third_party/liverec/models.py

      - name: Download frozen P1.1 base
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          artifact-ids: ${{ env.FROZEN_BASE_ARTIFACT_ID }}
          path: frozen_p1_base
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.FROZEN_BASE_RUN_ID }}

      - name: Verify frozen P1.1 base
        shell: bash
        run: |
          set -euo pipefail
          REPORT="frozen_p1_base/p1_base_dev_freeze.json"; CHECKPOINT="frozen_p1_base/$FROZEN_BASE_CHECKPOINT_REL"
          test -s "$REPORT"; test -s "$CHECKPOINT"
          echo "$FROZEN_BASE_REPORT_SHA256  $REPORT" | sha256sum -c -
          echo "$FROZEN_BASE_CHECKPOINT_SHA256  $CHECKPOINT" | sha256sum -c -
          "$HOME/venvs/kuailive-gpu/bin/python" - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('frozen_p1_base/p1_base_dev_freeze.json').read_text())
          assert r['official_commit']==os.environ['LIVEREC_OFFICIAL_COMMIT'] and r['test_ranking_inspected'] is False
          assert r['best_epoch']==74 and r['evaluation_equivalence_guard']['exact_match'] is True
          PY

      - name: Download current-run frozen P1.3 policy
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: liverec-p1-3-policy-${{ github.run_id }}
          path: liverec_p1_3/policy

      - name: Verify policy bundle
        shell: bash
        run: |
          set -euo pipefail
          (cd liverec_p1_3/policy && sha256sum -c SHA256SUMS)
          "$HOME/venvs/kuailive-gpu/bin/python" - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('liverec_p1_3/policy/p1_3_policy_manifest.json').read_text())
          assert r['test_ranking_inspected'] is False and r['memory_rule']['unchanged_from_p1_2'] is True
          assert len(r['utility_strata']['internal_cutpoints'])==9
          PY

      - name: Replay full dev export path and frozen gate inputs
        shell: bash
        working-directory: third_party/liverec
        run: |
          set -euo pipefail
          CHECKPOINT="$GITHUB_WORKSPACE/frozen_p1_base/$FROZEN_BASE_CHECKPOINT_REL"
          AV_CACHE="$HOME/.cache/kuailive-public/liverec/preprocessed/availability-${TWITCH_100K_SHA256}-${LIVEREC_OFFICIAL_COMMIT}.npz"
          "$HOME/venvs/kuailive-gpu/bin/python" p1_test_export.py --split dev \
            --checkpoint "$CHECKPOINT" --state-ecdf "$GITHUB_WORKSPACE/liverec_p1_3/policy/p1_2_state_ecdf.json" \
            --policy-manifest "$GITHUB_WORKSPACE/liverec_p1_3/policy/p1_3_policy_manifest.json" \
            --out-dir "$GITHUB_WORKSPACE/liverec_p1_3/dev_replay" --availability-cache "$AV_CACHE" \
            --model=LiveRec --dataset='dataset/' --fr_ctx --fr_rep --model_to='liverec_p1_gpu' --device='cuda' --seed=42 \
            --lr=0.0005 --l2=0.1 --batch_size=100 --seq_len=16 --dim=64 --num_att=2 --num_att_ctx=2 \
            --num_heads=4 --num_heads_ctx=4 --topk_att=64 --early_stop=15 --num_epochs=150
          cd "$GITHUB_WORKSPACE"
          "$HOME/venvs/kuailive-gpu/bin/python" - <<'PY'
          import json, numpy as np, pandas as pd
          from pathlib import Path
          got=json.loads(Path('liverec_p1_3/dev_replay/p1_3_dev_replay_summary.json').read_text())
          ref=json.loads(Path('liverec_p1_3/policy/p1_2_dev_export_summary.json').read_text())
          assert got['test_ranking_inspected'] is False and got['one_shot'] is False and got['n_dev']==ref['n_dev']==46878
          for section,keys in [('base',['h1','ndcg10','h10']),('memory',['ndcg10','h10'])]:
              for key in keys: assert abs(got[section][key]-ref[section][key])<5e-12,(section,key)
          assert abs(got['memory_minus_base_ndcg10']-ref['memory_minus_base_ndcg10'])<5e-12
          assert abs(got['official_repeat_fraction']-ref['official_repeat_fraction'])<5e-12
          assert got['horizon_counts']==ref['horizon_counts'] and got['base_rank_equivalence_guard']['exact_match'] is True
          replay=pd.read_csv('liverec_p1_3/dev_replay/p1_3_dev_replay_events.csv.gz')
          frozen=pd.read_csv('liverec_p1_3/policy/p1_2_dev_oof_predictions.csv.gz')
          assert replay.user_id.tolist()==frozen.user_id.tolist()
          exact_cols=['relationship_horizon','official_repeat','base_rank0','memory_rank0']
          for c in exact_cols: assert replay[c].astype(str).tolist()==frozen[c].astype(str).tolist(),c
          float_cols=['log_history_len','repeat_rate','preference_entropy','preference_drift','time_regularity','state_complexity',
                      'base_score_std','base_score_range','base_margin12','base_margin15','base_margin1011','base_top1_z','base_entropy','base_top10_mass']
          for c in float_cols:
              err=float(np.max(np.abs(replay[c].to_numpy(float)-frozen[c].to_numpy(float))))
              assert err<=1e-10,(c,err)
          print('full dev replay matched frozen P1.2 outcomes and gate inputs')
          PY
          rm -rf liverec_p1_3/dev_replay

      - name: Prepare repository-visible one-shot opening marker
        shell: bash
        run: |
          set -euo pipefail
          printf '{"run_id":"%s","controller_sha":"%s","prepared_at_utc":"%s","meaning":"P1.3 test opening is committed; do not rerun"}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > liverec_p1_3/test_opened/test_opened.json

      - name: Commit repository one-shot marker before test access
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: liverec-p1-3-test-opened-${{ github.run_id }}
          path: liverec_p1_3/test_opened/test_opened.json
          if-no-files-found: error
          retention-days: 90

      - name: Commit persistent local one-shot sentinel
        shell: bash
        run: |
          set -euo pipefail
          SENT_DIR="$HOME/.cache/kuailive-one-shot"; SENT="$SENT_DIR/liverec-p1-3-test.json"; mkdir -p "$SENT_DIR"
          test ! -e "$SENT" || { echo 'ERROR: local sentinel appeared concurrently' >&2; cat "$SENT" >&2; exit 1; }
          cp liverec_p1_3/test_opened/test_opened.json "$SENT.tmp"; mv "$SENT.tmp" "$SENT"; cat "$SENT"

      - name: Export untouched P1.3 test evidence exactly once
        shell: bash
        working-directory: third_party/liverec
        run: |
          set -euo pipefail
          CHECKPOINT="$GITHUB_WORKSPACE/frozen_p1_base/$FROZEN_BASE_CHECKPOINT_REL"
          AV_CACHE="$HOME/.cache/kuailive-public/liverec/preprocessed/availability-${TWITCH_100K_SHA256}-${LIVEREC_OFFICIAL_COMMIT}.npz"
          "$HOME/venvs/kuailive-gpu/bin/python" p1_test_export.py --split test \
            --checkpoint "$CHECKPOINT" --state-ecdf "$GITHUB_WORKSPACE/liverec_p1_3/policy/p1_2_state_ecdf.json" \
            --policy-manifest "$GITHUB_WORKSPACE/liverec_p1_3/policy/p1_3_policy_manifest.json" \
            --out-dir "$GITHUB_WORKSPACE/liverec_p1_3/test_export" --availability-cache "$AV_CACHE" \
            --model=LiveRec --dataset='dataset/' --fr_ctx --fr_rep --model_to='liverec_p1_gpu' --device='cuda' --seed=42 \
            --lr=0.0005 --l2=0.1 --batch_size=100 --seq_len=16 --dim=64 --num_att=2 --num_att_ctx=2 \
            --num_heads=4 --num_heads_ctx=4 --topk_att=64 --early_stop=15 --num_epochs=150
          cd "$GITHUB_WORKSPACE/liverec_p1_3/test_export"
          sha256sum p1_3_test_events.csv.gz p1_3_test_export_summary.json > SHA256SUMS

      - name: Validate one-shot test export integrity only
        shell: bash
        run: |
          set -euo pipefail
          "$HOME/venvs/kuailive-gpu/bin/python" - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('liverec_p1_3/test_export/p1_3_test_export_summary.json').read_text())
          assert r['test_ranking_inspected'] is True and r['one_shot'] is True and r['n_test']==44221
          assert r['base_rank_equivalence_guard']['exact_match'] is True
          assert set(r['horizon_counts'])<={'recent_visible','long_horizon_only','unseen'} and sum(r['horizon_counts'].values())==44221
          PY

      - name: Upload immutable one-shot test export
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: liverec-p1-3-test-export-${{ github.run_id }}
          path: liverec_p1_3/test_export/
          if-no-files-found: error
          retention-days: 90

      - name: Remove residual model/data workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf frozen_p1_base third_party/liverec/dataset liverec_p1_3/dev_replay

  evaluate-one-shot-test:
    needs: [freeze-policy-preflight, export-untouched-test]
    if: ${{ needs.freeze-policy-preflight.result == 'success' && needs.export-untouched-test.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - name: Checkout same frozen controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download frozen policy
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: liverec-p1-3-policy-${{ github.run_id }}
          path: liverec_p1_3/policy

      - name: Download one-shot test export
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: liverec-p1-3-test-export-${{ github.run_id }}
          path: liverec_p1_3/test_export

      - name: Verify evidence hashes
        shell: bash
        run: |
          set -euo pipefail
          (cd liverec_p1_3/policy && sha256sum -c SHA256SUMS)
          (cd liverec_p1_3/test_export && sha256sum -c SHA256SUMS)

      - name: Install exact frozen analysis runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            'numpy==1.26.4' 'pandas==2.3.3' 'scipy==1.17.1' \
            'scikit-learn==1.5.2' 'joblib==1.4.2' 'threadpoolctl==3.7.0'
          python -m py_compile analysis/liverec_p1_test_evaluate.py

      - name: Apply frozen policies and compute final report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p liverec_p1_3/final
          python analysis/liverec_p1_test_evaluate.py \
            --test-events liverec_p1_3/test_export/p1_3_test_events.csv.gz \
            --utility-gate liverec_p1_3/policy/p1_2_frozen_utility_gate.joblib \
            --difficulty-gate liverec_p1_3/policy/p1_2_frozen_difficulty_gate.joblib \
            --policy-manifest liverec_p1_3/policy/p1_3_policy_manifest.json \
            --test-export-summary liverec_p1_3/test_export/p1_3_test_export_summary.json \
            --out-dir liverec_p1_3/final
          cd liverec_p1_3/final
          sha256sum p1_3_test_final_report.json p1_3_test_predictions.csv.gz > SHA256SUMS

      - name: Validate final report without conditioning on outcome
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('liverec_p1_3/final/p1_3_test_final_report.json').read_text())
          assert r['test_ranking_inspected'] is True and r['one_shot'] is True and r['n_test']==44221
          assert r['policy']['difficulty_budget_exact_match'] is True and r['policy']['oracle_budget_exact_match'] is True
          assert len(r['relationship_horizon'])==3 and len(r['repeat_novel'])==2 and len(r['utility_strata'])==10
          print(json.dumps(r,indent=2))
          PY

      - name: Upload final immutable P1.3 result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: liverec-p1-3-test-final-${{ github.run_id }}
          path: |
            liverec_p1_3/final/p1_3_test_final_report.json
            liverec_p1_3/final/p1_3_test_predictions.csv.gz
            liverec_p1_3/final/SHA256SUMS
            liverec_p1_3/test_export/p1_3_test_export_summary.json
            liverec_p1_3/policy/p1_3_policy_manifest.json
            liverec_p1_3/policy/p1_2_dev_gate_report.json
          if-no-files-found: error
          retention-days: 90
