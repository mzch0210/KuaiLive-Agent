name: Official ReChorus SASRec TiSASRec validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/kuailive_agent/export_rechorus.py'
      - 'scripts/summarize_rechorus.py'
      - '.github/workflows/rechorus-official.yml'

permissions:
  contents: read

jobs:
  prepare-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      N_NEG: '574'
      SEED: '20260918'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/download_kuailive.py --data-root data
      - run: python -m kuailive_agent.prepare --data-dir "$(cat data/dataset_dir.txt)" --out-dir data/prepared/shop --scope shop
      - name: Export fixed-length legal active-at-time candidate sets
        run: python -m kuailive_agent.export_rechorus --prepared-dir data/prepared/shop --out-root rechorus_data --dataset KuaiLiveShop --n-neg "$N_NEG" --seed "$SEED"
      - name: Re-evaluate transparent agent policies on exactly the same candidate count
        run: python -m kuailive_agent.evaluate --prepared-dir data/prepared/shop --out-dir agent_fixed574 --n-neg "$N_NEG" --seed "$SEED"
      - uses: actions/upload-artifact@v4
        with:
          name: rechorus-kuailive-shop-data
          path: rechorus_data/KuaiLiveShop/**
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: agent-fixed574-results
          path: agent_fixed574/**
          retention-days: 30

  grid:
    needs: prepare-data
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - {model: SASRec, lr: '0.0001', history: 20, heads: 4}
          - {model: SASRec, lr: '0.0005', history: 20, heads: 4}
          - {model: SASRec, lr: '0.0001', history: 50, heads: 4}
          - {model: SASRec, lr: '0.0005', history: 50, heads: 4}
          - {model: TiSASRec, lr: '0.0001', history: 20, heads: 1}
          - {model: TiSASRec, lr: '0.0005', history: 20, heads: 1}
          - {model: TiSASRec, lr: '0.0001', history: 50, heads: 1}
          - {model: TiSASRec, lr: '0.0005', history: 50, heads: 1}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install CPU PyTorch and ReChorus runtime dependencies
        run: |
          pip install 'torch==2.4.1' --index-url https://download.pytorch.org/whl/cpu
          pip install 'numpy<2' 'pandas<3' tqdm 'scipy<2' 'scikit-learn<2' pyyaml
      - uses: actions/download-artifact@v4
        with:
          name: rechorus-kuailive-shop-data
          path: rechorus_data/KuaiLiveShop
      - name: Pin official ReChorus
        run: |
          git clone --filter=blob:none https://github.com/THUwangcy/ReChorus.git third_party/ReChorus
          cd third_party/ReChorus
          git checkout c164ec4303cc20ddcfbd1b57de366a481811d1e5
      - name: Train with validation selection and early stopping
        env:
          MODEL: ${{ matrix.model }}
          LR: ${{ matrix.lr }}
          HISTORY: ${{ matrix.history }}
          HEADS: ${{ matrix.heads }}
        run: |
          mkdir -p output models
          LOG="$GITHUB_WORKSPACE/output/${MODEL}_lr${LR}_hist${HISTORY}.log"
          MODEL_PATH="$GITHUB_WORKSPACE/models/${MODEL}_lr${LR}_hist${HISTORY}.pt"
          cd third_party/ReChorus/src
          python main.py \
            --model_name "$MODEL" --dataset KuaiLiveShop --path "$GITHUB_WORKSPACE/rechorus_data/" \
            --gpu '' --random_seed 20260918 --emb_size 64 --num_layers 1 --num_heads "$HEADS" \
            --history_max "$HISTORY" --lr "$LR" --l2 1e-6 --batch_size 1024 --eval_batch_size 128 \
            --epoch 30 --early_stop 5 --main_metric NDCG@10 --topk 10 --metric NDCG,HR \
            --num_workers 2 --save_final_results 0 --regenerate 1 \
            --log_file "$LOG" --model_path "$MODEL_PATH"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rechorus-run-${{ matrix.model }}-lr${{ matrix.lr }}-hist${{ matrix.history }}
          path: output/*.log
          if-no-files-found: warn
          retention-days: 30

  summarize:
    needs: grid
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas
      - uses: actions/download-artifact@v4
        with:
          pattern: rechorus-run-*
          path: rechorus_runs
          merge-multiple: true
      - run: python scripts/summarize_rechorus.py
      - uses: actions/upload-artifact@v4
        with:
          name: rechorus-grid-summary-${{ github.run_id }}
          path: rechorus_summary/**
          retention-days: 30
