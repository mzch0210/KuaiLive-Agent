name: KBS Plan C G3 full-active DEV paired Base Memory
on:
  push:
    branches: [main]
    paths: ['.github/workflows/kbs-plan-c-g3-full-dev-pair.yml']
permissions:
  contents: read
jobs:
  hosted-lock:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'authorize Plan C G3 full-active DEV paired scoring')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Pin source, training identity and holdout boundaries
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile analysis/kbs_plan_c/g3_dev_full_active.py \
            analysis/kbs_plan_c/test_g3_dev_full_active.py
          python - <<'PY'
          import json
          p=json.load(open('experiments/kbs_plan_c/G0F_PRETEST_PROTOCOL_2026-10-12.json'))
          assert p['status']=='SCIENTIFIC_DESIGN_PREREGISTERED_TEST_REMAINS_LOCKED'
          assert p['memory']['weights']=={'short':0.45,'long':0.45,'training_popularity':0.10}
          assert p['meta']['test_performance_seen'] is False
          print('G3 full-active DEV scoring only; TEST remains sealed.')
          PY
          mkdir -p g3-code
          cp analysis/kbs_plan_c/g2_train_base.py g3-code/
          cp analysis/kbs_plan_c/g3_dev_full_active.py g3-code/
          cp analysis/kbs_plan_c/test_g3_dev_full_active.py g3-code/
          (cd g3-code && sha256sum *.py > SHA256SUMS && sha256sum -c SHA256SUMS)
      - uses: actions/cache/save@v4
        with:
          key: kbs-plan-c-g3-dev-full-active-paired-v1
          path: g3-code/
  user-host-g3:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'authorize Plan C G3 full-active DEV paired scoring')
    needs: hosted-lock
    runs-on: [self-hosted, linux, x64, gpu-3090]
    timeout-minutes: 155
    concurrency:
      group: kuailive-gpu-3090
      cancel-in-progress: false
    steps:
      - name: Verify 3090, persistent G1 and DEV-selected checkpoint cache
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = mzch0210/KuaiLive-Agent
          test "$GITHUB_REF" = refs/heads/main
          test -x "$HOME/venvs/kuailive-gpu/bin/python"
          ROOT="$HOME/.cache/kuailive-agent-kbs"
          test -s "$ROOT/klm3_plan_c_g1_v1/manifest.json"
          test -s "$ROOT/klm3_g2_train_index_v1/index_manifest.json"
          test -s "$ROOT/klm3_g2_dev_checkpoint_screen_v1/manifest.json"
          test -s "$ROOT/klm3_g2_checkpoint_dev_selected_v1.json"
          nvidia-smi
      - uses: actions/cache/restore@v4
        with:
          key: kbs-plan-c-g3-dev-full-active-paired-v1
          path: g3-code/
          fail-on-cache-miss: true
      - name: Unit-test fixed Memory, pretarget histories and roster before reading full DEV
        shell: bash
        run: |
          set -euo pipefail
          (cd g3-code && sha256sum -c SHA256SUMS)
          export PYTHONPATH="$PWD/g3-code:$HOME/.cache/kuailive-agent-kbs/audit-py312-tools-v1"
          export OPENBLAS_NUM_THREADS=1
          export OMP_NUM_THREADS=2
          "$HOME/venvs/kuailive-gpu/bin/python" -m unittest discover \
            -s g3-code -p test_g3_dev_full_active.py -v
      - name: Full-active DEV paired SASRec GRU4Rec Memory score, single reusable cached panel
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export PYTHONPATH="$PWD/g3-code:$HOME/.cache/kuailive-agent-kbs/audit-py312-tools-v1"
          export OPENBLAS_NUM_THREADS=1
          export OMP_NUM_THREADS=2
          export PYTHONUNBUFFERED=1
          ROOT="$HOME/.cache/kuailive-agent-kbs"
          "$HOME/venvs/kuailive-gpu/bin/python" g3-code/g3_dev_full_active.py \
            --g1 "$ROOT/klm3_plan_c_g1_v1" \
            --train-index "$ROOT/klm3_g2_train_index_v1" \
            --dev "$ROOT/klm3_g2_dev_checkpoint_screen_v1" \
            --selected "$ROOT/klm3_g2_checkpoint_dev_selected_v1.json" \
            --train-root "$ROOT/klm3_g2_seed20261012_epoch3_v1" \
            --out "$ROOT/klm3_g3_dev_fullactive_base_memory_v1" \
            --block 12
          mkdir -p g3-report
          cp "$ROOT/klm3_g3_dev_fullactive_base_memory_v1/summary.json" \
             g3-report/summary.json
          "$HOME/venvs/kuailive-gpu/bin/python" - <<'PY'
          import json
          x=json.load(open('g3-report/summary.json'))
          assert x['schema']=='kbs-plan-c-full-active-dev-paired-v1'
          assert x['scope']=='DEV_ONLY' and x['all_dev_scored']
          assert x['n_scored']==50049
          assert not x['source_test_outcomes_inspected']
          assert not x['test_file_accessed'] and not x['gates_fit']
          assert set(x['aggregate'])=={'sasrec','gru4rec','memory'}
          for v in x['aggregate'].values():
              assert 0 <= v['ndcg10'] <= 1
          print('G3 full DEV paired cache accepted. TEST not accessed.')
          PY
      - name: Upload only aggregate scientific DEV evidence (no identifiers or event rows)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kbs-plan-c-g3-dev-aggregate
          path: g3-report/summary.json
          if-no-files-found: warn
          retention-days: 21
