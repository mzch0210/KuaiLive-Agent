name: KBS N12 NI1f Public Partial Identification
on:
  push:
    branches: [kbs-n12-single-thesis-restructure-plan-20261014]
    paths:
      - 'analysis/kbs_plan_c/ni1f_partial_identification.py'
      - 'analysis/kbs_plan_c/test_ni1f_partial_identification.py'
      - '.github/workflows/kbs-n12-ni1f-partial-identification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lp-public-math:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Install fixed numeric dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 scipy==1.14.1
      - name: Run sampled-label partial identification and tests
        run: |
          set -euo pipefail
          python analysis/kbs_plan_c/ni1f_partial_identification.py
          cd analysis/kbs_plan_c
          python -m unittest -v test_ni1f_partial_identification.py
