name: KBS Plan C hosted M3 schema and source integrity
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kbs-plan-c-hosted-m3-schema.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosted-m3-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install metadata-only Parquet reader
        run: python -m pip install --disable-pip-version-check 'pyarrow==17.0.0'
      - name: Acquire bounded CSV prefix and verified full room metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/klm3" reports
          BASE='https://huggingface.co/datasets/imgkkk2004/KuaiLive-M3/resolve/138d213a23e261ed3094d27ed8a4b867fb9143fe'
          curl --fail --location --silent --show-error --retry 3 --retry-delay 3 --connect-timeout 20 --max-time 120             --range '0-2097151' "$BASE/live_interaction.csv?download=true"             -o "$RUNNER_TEMP/klm3/interaction_prefix.csv"
          test "$(stat -c %s "$RUNNER_TEMP/klm3/interaction_prefix.csv")" -le 2097152
          curl --fail --location --silent --show-error --retry 3 --retry-delay 3 --connect-timeout 20 --max-time 1200             "$BASE/live_room_meta.parquet?download=true"             -o "$RUNNER_TEMP/klm3/live_room_meta.parquet"
          test "$(stat -c %s "$RUNNER_TEMP/klm3/live_room_meta.parquet")" = '237756481'
          echo '130986065f8fff7cb1146a7c6508979cf0df60f39a7d923f35003e1f29f0599a  '${RUNNER_TEMP}'/klm3/live_room_meta.parquet' | sha256sum -c -
      - name: Audit only columns and metadata; no TEST labels or ranking
        env:
          AUDIT_INPUT_ROOT: ${{ runner.temp }}/klm3
        run: |
          python - <<'PY'
          import csv,json,os,pyarrow.parquet as pq
          from pathlib import Path
          r=Path(os.environ['AUDIT_INPUT_ROOT'])
          with (r/'interaction_prefix.csv').open(newline='',encoding='utf-8-sig') as f:
              reader=csv.reader(f)
              fields=next(reader)
              count=sum(1 for _ in reader)
          pf=pq.ParquetFile(r/'live_room_meta.parquet')
          cols=pf.schema_arrow.names
          out={'schema':'kbs-m3-metadata-v1','source_revision':'138d213a23e261ed3094d27ed8a4b867fb9143fe',
            'interaction_header':fields,'prefix_rows_observed':count,
            'room_meta_header':cols,'room_meta_n_rows':pf.metadata.num_rows,
            'room_meta_row_groups':pf.metadata.num_row_groups,
            'room_meta_sha256_verified':True,'test_scoring':False,
            'raw_data_uploaded':False,'full_interaction_downloaded':False}
          Path('reports/m3_schema_only.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kbs-plan-c-m3-schema-${{ github.run_id }}
          path: reports/m3_schema_only.json
          retention-days: 3
      - name: Remove source bytes
        if: always()
        run: rm -rf "$RUNNER_TEMP/klm3"
