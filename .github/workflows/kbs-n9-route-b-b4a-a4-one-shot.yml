                      d["x_"+model+"_base_top_z"]=(top1-mean)/max(std,1e-8)
                      d["x_"+model+"_base_top_score"]=top1
                      d["x_"+model+"_base_score_mean"]=mean
                  output.append(d)
              return output
          
          
          def main():
