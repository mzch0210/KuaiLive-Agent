name: KBS B4-A A4 single sealed target-label reveal and frozen 3-hypothesis analysis
on:
  push:
    branches: [kbs-b4a-a3-synthetic-preflight-20261014]
permissions:
  contents: read
concurrency:
  group: kbs-b4a-a4-one-shot-author-labels
  cancel-in-progress: false
jobs:
  one-and-only-b4a-confirmation:
    if: github.ref == 'refs/heads/kbs-b4a-a3-synthetic-preflight-20261014' && contains(github.event.head_commit.message, 'authorize B4-A A4 one shot author label reveal')
    runs-on: [self-hosted, linux, x64, gpu-3090]
    timeout-minutes: 70
    steps:
      - name: Require independent strict prereveal PASS, no previous A4 attempt
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ROOT="$HOME/.cache/kuailive-agent-kbs"
          test -s "$ROOT/klm3_n9_b4a_a4_strict_prereveal_v1/summary.json"
          test -s "$ROOT/klm3_n9_b4a_a3_final_lock_v1/manifest.json"
          test ! -e "$ROOT/klm3_n9_b4a_a4_one_shot_v1"
          test ! -e "$ROOT/klm3_n9_b4a_a4_one_shot_v1.unseal_in_progress"
          "$HOME/venvs/kuailive-gpu/bin/python" - <<'PRE_A4'
          import pathlib,json,hashlib
          root=pathlib.Path.home()/'.cache/kuailive-agent-kbs'
          x=json.loads((root/'klm3_n9_b4a_a4_strict_prereveal_v1/summary.json').read_text())
          assert x['status']=='PASS_ALL_A3_SHA_AND_FROZEN_PRIMARY_ESTIMANDS_NO_LABELS_READ'
          assert not x['target_author_column_opened'] and not x['A4_NDCG_computed_from_real_targets']
          y=root/'klm3_n9_b4a_a3_final_lock_v1/manifest.json'
          h=hashlib.sha256(y.read_bytes()).hexdigest()
          assert h==x['A3_final_lock_SHA256']
          print('Author-label reveal A4 entered only after independent sealed A3 and frozen statistical source pass',flush=True)
          PRE_A4
      - name: Materialize EXACT prereveal-verified A4 source and frozen population weights
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/g2_train_base.py" <<'A4_ONESHOT_SOURCE_0'
          #!/usr/bin/env python3
          """KBS Plan C G2: train-only GPU baselines and reusable author sequence index.
          
          No TEST file is opened. Training is not DEV model selection. This module only
          produces TRAIN checkpoints and pilot throughput/memory observations. Models
          must be evaluated/selected on a frozen DEV protocol before TEST.
          """
          from __future__ import annotations
          import argparse
          import hashlib
          import json
          import os
          import random
          import time
          from pathlib import Path
          
          import numpy as np
          import torch
          from torch import nn
          import torch.nn.functional as F
          
          L = 16
          D = 64
          
          
          def digest(file: Path):
              h = hashlib.sha256()
              with file.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(8 * 1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()
          
          
          class Encoder(nn.Module):
              def __init__(self, items, kind):
                  super().__init__()
                  if kind not in ("sasrec", "gru4rec"):
                      raise ValueError("unknown Base family")
                  self.kind = kind
                  self.item = nn.Embedding(items + 1, D, padding_idx=0)
                  nn.init.normal_(self.item.weight, 0, .02)
                  with torch.no_grad():
                      self.item.weight[0].zero_()
                  if kind == "sasrec":
                      self.pos = nn.Embedding(L, D)
                      self.norm = nn.LayerNorm(D)
                      block = nn.TransformerEncoderLayer(
                          D, nhead=4, dim_feedforward=D * 4, dropout=.1,
                          activation="gelu", batch_first=True, norm_first=True)
                      self.encoder = nn.TransformerEncoder(block, num_layers=1, enable_nested_tensor=False)
                      self.dropout = nn.Dropout(.1)
                      self.register_buffer(
                          "causal", torch.triu(torch.ones(L, L, dtype=torch.bool), 1),
                          persistent=False)
                  else:
                      self.encoder = nn.GRU(D, D, num_layers=1, batch_first=True)
                      self.norm = nn.LayerNorm(D)
          
              def forward(self, history):
                  # Histories are left-padded and nonempty; latest event is rightmost.
                  if self.kind == "sasrec":
                      # IMPORTANT: left padding plus a causal mask can leave an all-masked
                      # query row (NaNs in SDPA). Shift valid ids to the LEFT so the
                      # earliest query always has a legal self-attention key. Padding is
                      # now on the RIGHT and the last valid state is gathered explicitly.
                      count = history.ne(0).sum(1)
                      if torch.any(count == 0):
                          raise ValueError("SASRec requires a nonempty causal history")
                      steps = torch.arange(history.shape[1], device=history.device)
                      gather_idx = (steps[None, :] + history.shape[1] - count[:, None]) % history.shape[1]
                      right = history.gather(1, gather_idx)
                      x = self.item(right)
                      x = self.dropout(x + self.pos(steps))
                      x = self.encoder(x, mask=self.causal[:history.shape[1], :history.shape[1]],
                                       src_key_padding_mask=right.eq(0))
                      last=x[torch.arange(history.shape[0],device=history.device), count-1]
                      return self.norm(last)
                  x = self.item(history)
                  # Right-aligned sequences; a single GRU applied to all positions
                  # handles left padding consistently across train and DEV.
                  x, _ = self.encoder(x)
                  return self.norm(x[:, -1])
          
              def score(self, history, candidate_ids):
                  rep = self(history)
                  return (rep.unsqueeze(-2) * self.item(candidate_ids)).sum(-1)
          
          
          def load_or_prepare_train_index(g1: Path, cache: Path, synthetic=False):
              import pyarrow.parquet as pq
              manifest = json.loads((g1/"manifest.json").read_text())
              if (manifest["schema"] != "kbs-plan-c-g1-derived-v1"
                      or manifest["test_outcomes_inspected"] is not False):
                  raise ValueError("wrong G1 source: expected TEST-unseen TRAIN bundle")
              authors_path = g1 / "train_known_authors.parquet"
              events_path = g1 / "train_author_events.parquet"
              for path in (authors_path, events_path):
                  if not path.is_file():
                      raise FileNotFoundError(path)
                  if not synthetic and digest(path) != manifest["generated_files_sha256"][path.name]:
                      raise ValueError("train input digest mismatch " + path.name)
              expected = {"g1_protocol_sha256": manifest["protocol_sha256"],
                          "train_author_sha256": manifest["generated_files_sha256"][authors_path.name],
                          "train_events_sha256": manifest["generated_files_sha256"][events_path.name],
                          "item_index_zero_reserved": True}
              idx_manifest = cache / "index_manifest.json"
              if idx_manifest.exists():
                  record = json.loads(idx_manifest.read_text())
                  if any(record.get(k) != v for k, v in expected.items()):
                      raise ValueError("TRAIN index manifest does not match source/protocol")
                  for name in ("authors.npy", "sequence_ids.npy", "user_offsets.npy", "popularity_cdf.npy"):
                      if digest(cache/name) != record["files_sha256"][name]:
                          raise ValueError("TRAIN index was modified " + name)
                  return record
              if cache.exists():
                  raise FileExistsError("Incomplete existing TRAIN index; inspect, never overwrite")
              stage = cache.with_name(cache.name+".partial")
              if stage.exists():
                  raise FileExistsError("Interrupted stage exists; do not overwrite")
              stage.mkdir(parents=True, mode=0o700)
              author_arr = pq.read_table(authors_path, columns=["author_id"]).column("author_id").to_numpy()
              author_arr = np.asarray(author_arr, dtype=np.int64)
              if not np.all(author_arr[1:] > author_arr[:-1]):
                  raise ValueError("TRAIN author IDs must be strictly ascending")
              table = pq.read_table(events_path, columns=["user_id", "author_id"])
              users = np.asarray(table.column("user_id").to_numpy(), dtype=np.int64)
              raw_items = np.asarray(table.column("author_id").to_numpy(), dtype=np.int64)
              if len(users) < 100 or len(author_arr) < 3:
                  if not synthetic:
                      raise ValueError("Unexpectedly small TRAIN")
              if np.any(users[1:] < users[:-1]):
                  raise ValueError("TRAIN must be sorted by user and causal event time")
              mapped = np.searchsorted(author_arr, raw_items)
              if np.any(mapped >= len(author_arr)) or np.any(author_arr[mapped] != raw_items):
                  raise ValueError("TRAIN event contains unknown author")
              ids = (mapped + 1).astype(np.int32)
              starts = np.concatenate(([0], np.flatnonzero(users[1:] != users[:-1])+1,
                                       [len(users)])).astype(np.int64)
              counts = np.bincount(ids, minlength=len(author_arr)+1).astype(np.float64)
              weights = np.power(counts[1:], .75)
              cdf = np.cumsum(weights)
              cdf /= cdf[-1]
              for name,array in (
                  ("authors.npy", author_arr),
                  ("sequence_ids.npy", ids),
                  ("user_offsets.npy", starts),
                  ("popularity_cdf.npy", cdf)
              ):
                  np.save(stage/name, array, allow_pickle=False)
              record = dict(expected)
              record.update({"schema":"kbs-plan-c-g2-train-index-v1",
                             "total_training_events":int(len(ids)),
                             "unique_train_users":int(len(starts)-1),
                             "unique_train_authors":int(len(author_arr)),
                             "training_only":True,"dev_labels_used":False,
                             "test_files_opened":False,
                             "files_sha256":{n:digest(stage/n) for n in
                                 ("authors.npy","sequence_ids.npy","user_offsets.npy","popularity_cdf.npy")}})
              (stage/"index_manifest.json").write_text(json.dumps(record,indent=2)+"\n")
              stage.rename(cache)
              return record
          
          
          def draw_contexts(ids, offsets, rng, batch, context=L):
              # Unbiased random TRAIN event positions conditioned on >=2 prior user events.
              batchpos = rng.integers(0, len(ids), size=batch*2, dtype=np.int64)
              out=[]
              while len(out) < batch:
                  block=np.asarray(batchpos)
                  uid=np.searchsorted(offsets,block,side="right")-1
                  start=offsets[uid]
                  valid=block >= start+2
                  out.extend(block[valid].tolist())
                  if len(out)<batch:
                      batchpos=rng.integers(0,len(ids),size=batch,dtype=np.int64)
              positions=np.asarray(out[:batch],dtype=np.int64)
              groups=np.searchsorted(offsets,positions,side="right")-1
              first=offsets[groups]
              indices=positions[:,None]-np.arange(context,0,-1)[None,:]
              valid=indices >= first[:,None]
              padded=np.zeros((batch,context),dtype=np.int64)
              padded[valid]=ids[indices[valid]]
              return padded, ids[positions].astype(np.int64)
          
          
          def sample_negatives(cdf, rng, positives, contexts, n_neg=32):
              batch=len(positives)
              half=n_neg//2
              uniform=rng.integers(1,len(cdf)+1,size=(batch,n_neg-half),dtype=np.int64)
              pop=np.searchsorted(cdf,rng.random((batch,half)))+1
              neg=np.concatenate((uniform,pop),axis=1).astype(np.int64)
              invalid=(neg==positives[:,None]) | (neg[:,:,None]==contexts[:,None,:]).any(axis=2)
              # Bounded deterministic repair; extremely rare for million-item vocabulary.
              for _ in range(3):
                  if not invalid.any():
                      break
                  neg[invalid]=rng.integers(1,len(cdf)+1,size=int(invalid.sum()))
                  invalid=(neg==positives[:,None]) | (neg[:,:,None]==contexts[:,None,:]).any(axis=2)
              if invalid.any():
                  neg[invalid]=((positives[:,None]+np.arange(n_neg)[None,:])%len(cdf)+1)[invalid]
              return neg
          
          
          def train(args):
              seed=int(args.seed)
              random.seed(seed)
              np.random.seed(seed)
              torch.manual_seed(seed)
              if torch.cuda.is_available():
                  torch.cuda.manual_seed_all(seed)
              if not args.synthetic and not torch.cuda.is_available():
                  raise RuntimeError("G2 real pilot/fit needs CUDA GPU")
              device="cuda" if torch.cuda.is_available() and not args.cpu else "cpu"
              if not args.synthetic and device!="cuda":
                  raise RuntimeError("Real G2 must not silently train on CPU")
              src_manifest=load_or_prepare_train_index(args.g1,args.index,args.synthetic)
              ids=np.load(args.index/"sequence_ids.npy",mmap_mode="r")
              offsets=np.load(args.index/"user_offsets.npy",mmap_mode="r")
              cdf=np.load(args.index/"popularity_cdf.npy",mmap_mode="r")
              count=src_manifest["unique_train_authors"]
              model=Encoder(count,args.model).to(device)
              optimizer=torch.optim.AdamW(model.parameters(),lr=args.learning_rate,weight_decay=1e-4)
              rng=np.random.default_rng(seed)
              stats=[]
              t0=time.monotonic()
              maxsteps=args.steps_per_epoch
              if args.mode=="smoke":
                  maxsteps=min(maxsteps,3)
              for ep in range(args.epochs):
                  model.train()
                  total=0.
                  for step in range(maxsteps):
                      seq,pos=draw_contexts(ids,offsets,rng,args.batch,L)
                      neg=sample_negatives(cdf,rng,pos,seq,args.negatives)
                      candidates=np.column_stack([pos,neg])
                      h=torch.as_tensor(seq,device=device,dtype=torch.long)
                      c=torch.as_tensor(candidates,device=device,dtype=torch.long)
                      optimizer.zero_grad(set_to_none=True)
                      logits=model.score(h,c)
                      loss=F.cross_entropy(logits,torch.zeros(len(seq),device=device,dtype=torch.long))
                      if not torch.isfinite(loss):
                          raise FloatingPointError("nonfinite TRAIN loss")
                      loss.backward()
                      torch.nn.utils.clip_grad_norm_(model.parameters(),max_norm=1.0)
                      optimizer.step()
                      total+=float(loss.detach().item())
                      if (step+1)%max(1,args.log_interval)==0:
                          print(json.dumps({"model":args.model,"epoch":ep+1,"steps":step+1,
                                            "TRAIN_loss":round(total/(step+1),6),
                                            "time_s":round(time.monotonic()-t0,1)}),flush=True)
                  record={"epoch":ep+1,"TRAIN_cross_entropy":total/maxsteps,
                          "elapsed_s":round(time.monotonic()-t0,2)}
                  stats.append(record)
                  if args.mode=="train":
                      args.out.mkdir(parents=True,exist_ok=True)
                      target=args.out/f"{args.model}_seed{seed}_epoch{ep+1}.pt"
                      tmp=target.with_suffix(".pt.partial")
                      torch.save({"model_family":args.model,"model_state":model.state_dict(),
                                  "optimizer_state":optimizer.state_dict(),"epoch":ep+1,
                                  "input_manifest":src_manifest,"seed":seed,
                                  "config":vars(args),"test_used":False,
                                  "dev_selected":False},tmp)
                      tmp.rename(target)
                      record["checkpoint"]=target.name
                      record["checkpoint_sha256"]=digest(target)
              device_info={"device":device,"torch":torch.__version__,
                           "cuda":torch.version.cuda}
              if device=="cuda":
                  device_info.update({"gpu":torch.cuda.get_device_name(0),
                                      "peak_vram_gib":round(
                                          torch.cuda.max_memory_allocated()/1024**3,3)})
              result={"schema":"kbs-plan-c-g2-train-only-v1",
                      "model_family":args.model,"mode":args.mode,
                      "seed":seed,"index_manifest":src_manifest,
                      "n_epochs":args.epochs,"steps_per_epoch":maxsteps,
                      "batch_size":args.batch,"negative_count":args.negatives,
                      "learning_rate":args.learning_rate,
                      "train_records":stats,"runtime":device_info,
                      "elapsed_s":round(time.monotonic()-t0,2),
                      "status":"TRAIN_CHECKPOINTS_NOT_DEV_SELECTED" if args.mode=="train" else "GPU_PILOT_ONLY",
                      "dev_outcomes_read":False,"test_outcomes_read":False}
              args.out.mkdir(parents=True,exist_ok=True)
              (args.out/f"{args.model}_{args.mode}_report.json").write_text(
                  json.dumps(result,indent=2,default=str)+"\n")
              print(json.dumps({"model_family":args.model,"status":result["status"],
                                "elapsed_s":result["elapsed_s"],
                                "peak_vram_gib":device_info.get("peak_vram_gib"),
                                "last_train_loss":stats[-1]["TRAIN_cross_entropy"]}),flush=True)
              return result
          
          
          def main():
              p=argparse.ArgumentParser()
              p.add_argument("--g1",type=Path,required=True)
              p.add_argument("--index",type=Path,required=True)
              p.add_argument("--out",type=Path,required=True)
              p.add_argument("--mode",choices=["smoke","pilot","train"],default="pilot")
              p.add_argument("--model",choices=["sasrec","gru4rec"],required=True)
              p.add_argument("--seed",type=int,default=20261012)
              p.add_argument("--batch",type=int,default=512)
              p.add_argument("--negatives",type=int,default=32)
              p.add_argument("--steps-per-epoch",type=int,default=160)
              p.add_argument("--epochs",type=int,default=1)
              p.add_argument("--learning-rate",type=float,default=.001)
              p.add_argument("--log-interval",type=int,default=40)
              p.add_argument("--synthetic",action="store_true")
              p.add_argument("--cpu",action="store_true")
              args=p.parse_args()
              if args.batch<1 or args.negatives<2 or args.steps_per_epoch<1 or args.epochs<1:
                  p.error("Invalid model size/step settings")
              train(args)
          if __name__=="__main__":
              main()
          A4_ONESHOT_SOURCE_0
          cat > "$RUNNER_TEMP/g3_dev_full_active.py" <<'A4_ONESHOT_SOURCE_1'
          #!/usr/bin/env python3
          """Plan C DEV-only full-active paired Base/Memory scoring with a single room sweep.
          
          All event-level artifacts remain in the User-host cache. Never read a TEST file.
          Follows G0F weights: train-only normalized log popularity (0.10),
          last-ten exponential short history (0.45), all-prior count/max long history (0.45).
          """
          from __future__ import annotations
          import argparse
          import collections
          import csv
          import hashlib
          import heapq
          import json
          import math
          import os
          import time
          from datetime import datetime
          from pathlib import Path
          
          import numpy as np
          import torch
          
          from g2_train_base import Encoder
          
          SHORT_K = 10
          SHORT_DECAY = 3.0
          WEIGHTS = (0.10, 0.45, 0.45)
          
          
          def sha(path):
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for block in iter(lambda: f.read(8*1024*1024), b""):
                      h.update(block)
              return h.hexdigest()
          
          
          def score_history(candidates, popularity, prior_map, recent):
              """Fixed target-blind Memory scores in token order (token reflects raw ID)."""
              candidates = np.asarray(candidates, dtype=np.int32)
              score = 0.10 * popularity[candidates].astype(np.float64)
              if prior_map:
                  keys = np.fromiter(prior_map.keys(), dtype=np.int32, count=len(prior_map))
                  cnt = np.fromiter(prior_map.values(), dtype=np.float64, count=len(prior_map))
                  order = np.argsort(keys)
                  keys, cnt = keys[order], cnt[order]
                  ix = np.searchsorted(keys, candidates)
                  valid = ix < len(keys)
                  valid[valid] &= keys[ix[valid]] == candidates[valid]
                  score[valid] += 0.45 * cnt[ix[valid]] / cnt.max()
              if recent:
                  vals = {}
                  for dist, author in enumerate(reversed(recent)):
                      score_t = math.exp(-dist/SHORT_DECAY)
                      vals[author] = max(vals.get(author, 0.), score_t)
                  keys = np.array(sorted(vals), dtype=np.int32)
                  strengths = np.array([vals[k] for k in keys], dtype=np.float64)
                  ix = np.searchsorted(keys, candidates)
                  valid = ix < len(keys)
                  valid[valid] &= keys[ix[valid]] == candidates[valid]
                  score[valid] += 0.45 * strengths[ix[valid]]
              return score
          
          
          def memory_rank(candidates, scores, true_id):
              """Target rank with deterministic author-ID tie break, zero-based 0 is best."""
              i = np.flatnonzero(candidates == true_id)
              if len(i) != 1:
                  raise ValueError("target must occur once in the exact eligible roster")
              ref = float(scores[i[0]])
              return 1 + int(np.count_nonzero((scores > ref + 1e-12) |
                            ((np.abs(scores-ref) <= 1e-12) & (candidates < true_id))))
          
          
          def ndcg(rank):
              return float(1.0/math.log2(rank+1)) if rank <= 10 else 0.0
          
          
          def build_dev_histories(stream_path, dev_event_ids, known_to_index, stride=2000000):
              """Replay TRAIN + previous DEV in sorted user-time order; never consume TEST."""
              import pyarrow.parquet as pq
              indices = {int(x):i for i,x in enumerate(dev_event_ids)}
              histories=[None]*len(indices)
              features=[None]*len(indices)
              last_user=None
              count=collections.Counter()
              recent=collections.deque(maxlen=SHORT_K)
              warm_hist_total=0
              all_hist_total=0
              processed=0
              captured=0
              reader=pq.ParquetFile(stream_path)
              for block in reader.iter_batches(batch_size=262144,
                        columns=["source_event_id","user_id","author_id","split"]):
                  d=block.to_pydict()
                  for e,u,author,split in zip(d["source_event_id"],d["user_id"],
                                              d["author_id"],d["split"]):
                      if split=="TEST":
                          continue
                      processed+=1
                      if u != last_user:
                          last_user=u
                          count.clear()
                          recent.clear()
                          warm_hist_total=0
                          all_hist_total=0
                      j=indices.get(int(e))
                      if j is not None:
                          if split!="DEV" or histories[j] is not None:
                              raise ValueError("non-DEV history match or duplicate id")
                          # Freeze counts and short horizon strictly before this event.
                          histories[j]=(dict(count), tuple(recent))
                          captured+=1
                          features[j]={"hist_events_all":all_hist_total,
                                       "hist_events_warm":warm_hist_total,
                                       "hist_distinct_warm":len(count),
                                       "hist_short_unique":len(set(recent)),
                                       "hist_max_repeat":max(count.values()) if count else 0}
                      token=known_to_index.get(int(author))
                      all_hist_total+=1
                      if token is not None:
                          count[token]+=1
                          recent.append(token)
                          warm_hist_total+=1
                      if stride and processed % stride==0:
                          print(json.dumps({"phase":"memory_history_scan","events":processed,
                                            "dev_captured":captured}),flush=True)
              if any(x is None for x in histories):
                  raise ValueError("Unable to capture all DEV target histories")
              return histories,features,processed
          
          
          def author_availability(rooms_file, sample_times, token_targets, known_to_index):
              """Yield (row index, sorted active distinct known-author tokens) once in time order."""
              import pyarrow.parquet as pq
              order=sorted(range(len(sample_times)),key=lambda i:(sample_times[i],i))
              room_file=pq.ParquetFile(rooms_file)
              def rooms():
                  for batch in room_file.iter_batches(batch_size=131072,
                              columns=["open_ts","close_ts","author_id"]):
                      data=batch.to_pydict()
                      yield from zip(data["open_ts"],data["close_ts"],data["author_id"])
              it=iter(rooms())
              ahead=next(it,None)
              heap=[]
              active=collections.Counter()
              max_rooms=0
              for ix in order:
                  t=sample_times[ix]
                  while ahead is not None and ahead[0] <= t:
                      start,end,author=ahead
                      token=known_to_index.get(int(author))
                      if token is not None and end > t:
                          active[token]+=1
                          heapq.heappush(heap,(end,token))
                      ahead=next(it,None)
                  while heap and heap[0][0] <= t:
                      _,token=heapq.heappop(heap)
                      active[token]-=1
                      if active[token]==0:
                          del active[token]
                  target=int(token_targets[ix])
                  if target not in active:
                      raise ValueError("frozen DEV target not available at pretarget clock")
                  max_rooms=max(max_rooms,len(heap))
                  yield ix,np.fromiter(sorted(active),dtype=np.int32,count=len(active)),max_rooms
          
          
          def prepare(input_g1, train_idx, dev_cache, dev_select, seed=20261012, limit=None):
              import pyarrow.parquet as pq
              a=json.loads((input_g1/"manifest.json").read_text())
              i=json.loads((train_idx/"index_manifest.json").read_text())
              d=json.loads((dev_cache/"manifest.json").read_text())
              s=json.loads(dev_select.read_text())
              if (a["schema"]!="kbs-plan-c-g1-derived-v1"
                      or d["schema"]!="kbs-plan-c-g2-dev-screen-v1"
                      or s["schema"]!="kbs-plan-c-g2-checkpoint-selection-dev-only-v1"
                      or a["protocol_sha256"]!=d["g1_protocol_sha256"]
                      or a["protocol_sha256"]!=i["g1_protocol_sha256"]
                      or s["test_data_opened"] is not False):
                  raise ValueError("G1/G2 DEV-frozen provenance mismatch")
              for name in ("dev_contexts.npy","dev_positive_author_tokens.npy",
                           "dev_source_event_ids.npy"):
                  if sha(dev_cache/name)!=d["files_sha256"][name]:
                      raise ValueError("DEV snapshot SHA mismatch")
              events=np.load(dev_cache/"dev_source_event_ids.npy")
              positives=np.load(dev_cache/"dev_positive_author_tokens.npy")
              contexts=np.load(dev_cache/"dev_contexts.npy",mmap_mode="r")
              author_ids=np.load(train_idx/"authors.npy",mmap_mode="r")
              known={int(a):j+1 for j,a in enumerate(author_ids)}
              dev=pq.read_table(input_g1/"dev_cohort.parquet",
                                columns=["source_event_id","user_id","observed_at"])
              check=np.asarray(dev.column("source_event_id").to_numpy(),dtype=np.int64)
              if not np.array_equal(check,events):
                  raise ValueError("DEV row order mismatch")
              clock=dev.column("observed_at").to_pylist()
              users=np.asarray(dev.column("user_id").to_numpy(),dtype=np.int64)
              if limit is not None:
                  if not (0 < limit <= len(events)):
                      raise ValueError("invalid DEV-only evaluation limit")
                  # Selection is strictly independent of target/rank information.
                  selected=np.unique(np.linspace(0,len(events)-1,limit,dtype=np.int64))
              else:
                  selected=np.arange(len(events),dtype=np.int64)
              # Histories are built once for exactly the designated DEV events.
              hist,features,processed=build_dev_histories(
                  input_g1/"causal_stream_sealed.parquet",events[selected],known)
              counts=np.bincount(np.load(train_idx/"sequence_ids.npy",mmap_mode="r"),
                                 minlength=len(author_ids)+1).astype(np.float64)
              logpop=np.log1p(counts)
              pmin=np.min(logpop[1:])
              pmax=np.max(logpop[1:])
              if not pmax>pmin:
                  raise ValueError("invalid train-only popularity")
              popularity=np.zeros(len(counts),dtype=np.float64)
              popularity[1:] = (logpop[1:]-pmin)/(pmax-pmin)
              return dict(g1=a,index=i,dev=d,selected=s,
                          indices=selected,events=events,users=users,clock=clock,
                          positives=positives,contexts=contexts,
                          train_counts=counts,popularity=popularity,
                          histories=hist,features=features,known=known,
                          history_scanned=processed)
          
          
          def load_models(training_root, index_manifest, dev_selected, device):
              models={}
              n=index_manifest["unique_train_authors"]
              for family in ("sasrec","gru4rec"):
                  meta=dev_selected["family_results"][family]["selected"]
                  ck=training_root/family/meta["checkpoint"]
                  if sha(ck)!=meta["checkpoint_sha256"]:
                      raise ValueError("DEV-selected checkpoint digest mismatch")
                  cp=torch.load(ck,map_location="cpu",weights_only=False)
                  if (cp["model_family"]!=family or cp["test_used"] is not False
                          or cp["dev_selected"] is not False):
                      raise ValueError("Unexpected checkpoint identity")
                  m=Encoder(n,family)
                  m.load_state_dict(cp["model_state"])
                  m.to(device).eval()
                  models[family]=m
                  del cp
              return models
          
          
          @torch.inference_mode()
          def representations(models,context,device,batch=256):
              ans={}
              for family,model in models.items():
                  outputs=[]
                  for offset in range(0,len(context),batch):
                      inp=torch.as_tensor(np.asarray(context[offset:offset+batch]),
                                          dtype=torch.long,device=device)
                      r=model(inp).detach().cpu().numpy().astype(np.float32)
                      if not np.isfinite(r).all():
                          raise FloatingPointError("invalid Base representation")
                      outputs.append(r)
                  ans[family]=np.concatenate(outputs)
              return ans
          
          
          @torch.inference_mode()
          def score_batch(models, reps, context_ids, candidates, device):
              """Same candidates, different frozen Base checkpoints; zero TEST access."""
              array=np.asarray(candidates,dtype=np.int64)
              candidates_t=torch.as_tensor(array,device=device,dtype=torch.long)
              output={}
              for name,model in models.items():
                  vec=torch.as_tensor(reps[name][context_ids],device=device)
                  emb=model.item(candidates_t)
                  pred=torch.einsum("bd,bkd->bk",vec,emb).detach().cpu().numpy()
                  if not np.isfinite(pred).all():
                      raise FloatingPointError("nonfinite candidate scores")
                  output[name]=pred
              return output
          
          
          def full_dev_scoring(g1, train_idx, dev_cache, selection_file, train_root,
                               output, limit=None, block=12, progress=500):
              if output.exists():
                  raise FileExistsError("Do not overwrite existing DEV evidence")
              t0=time.monotonic()
              prepared=prepare(g1,train_idx,dev_cache,selection_file,limit=limit)
              dev_idx=prepared["indices"]
              device="cuda"
              if not torch.cuda.is_available() or "3090" not in torch.cuda.get_device_name(0):
                  raise RuntimeError("User-host RTX3090 required")
              models=load_models(train_root,prepared["index"],prepared["selected"],device)
              reps=representations(models,prepared["contexts"][dev_idx],device)
              output.mkdir(parents=True,mode=0o700)
              rows=[]
              metrics=collections.defaultdict(lambda:collections.Counter())
              incoming=[]
              sample_time=[prepared["clock"][i] for i in dev_idx]
              for event_id,candidates,rooms in author_availability(
                      g1/"available_room_intervals.parquet",
                      sample_time,prepared["positives"][dev_idx],prepared["known"]):
                  incoming.append((event_id,candidates,rooms))
                  if len(incoming)<block:
                      continue
                  # Keep exact per-event candidates (may vary from 14k to >55k).
                  rows.extend(score_work_block(incoming,models,reps,prepared,dev_idx,device))
                  incoming.clear()
                  if progress and len(rows)%progress < block:
                      print(json.dumps({"stage":"DEV_full_active","rows":len(rows),
                          "elapsed_s":round(time.monotonic()-t0,1)}),flush=True)
              if incoming:
                  rows.extend(score_work_block(incoming,models,reps,prepared,dev_idx,device))
              if len(rows)!=len(dev_idx):
                  raise ValueError("incomplete DEV event scoring")
              rows.sort(key=lambda x:int(x["event_id"]))
              columns=list(rows[0])
              out_csv=output/"dev_full_active_pairs.csv"
              with out_csv.open("w",newline="") as f:
                  writer=csv.DictWriter(f,fieldnames=columns)
                  writer.writeheader()
                  writer.writerows(rows)
              summary={"schema":"kbs-plan-c-full-active-dev-paired-v1",
                       "scope":"DEV_ONLY","n_scored":len(rows),
                       "all_dev_scored":limit is None,
                       "base_checkpoint_sha":{family:prepared["selected"]["family_results"][family]["selected"]["checkpoint_sha256"] for family in models},
                       "g1_protocol_sha256":prepared["g1"]["protocol_sha256"],
                       "event_csv_sha256":sha(out_csv),
                       "source_test_outcomes_inspected":False,
                       "test_file_accessed":False,
                       "gates_fit":False,
                       "memory_definition":"0.10 train-logpop + 0.45 exp(-distance/3) last10 + 0.45 prior-count/maxcount",
                       "median_active_candidates":float(np.median([r["candidate_count"] for r in rows])),
                       "history_events_scanned":prepared["history_scanned"],
                       "elapsed_seconds":round(time.monotonic()-t0,1),
                       "aggregate":{}}
              for label in ("sasrec","gru4rec","memory"):
                  metric=np.asarray([float(r[label+"_ndcg10"]) for r in rows])
                  summary["aggregate"][label]={"ndcg10":float(metric.mean()),
                       "hr10":float(np.mean([int(r[label+"_rank"])<=10 for r in rows]))}
              for base in ("sasrec","gru4rec"):
                  delta=np.asarray([float(r["memory_ndcg10"])-float(r[base+"_ndcg10"]) for r in rows])
                  summary["aggregate"][base]["memory_minus_base_ndcg10"]=float(delta.mean())
              (output/"summary.json").write_text(json.dumps(summary,indent=2)+"\n")
              print(json.dumps(summary),flush=True)
              return summary
          
          
          def score_work_block(block, models, reps, state, selected, device):
              maxsize=max(len(x[1]) for x in block)
              padded=np.zeros((len(block),maxsize),dtype=np.int32)
              for j,(idx,vals,_) in enumerate(block):
                  padded[j,:len(vals)]=vals
              raw=score_batch(models,reps,
                              [x[0] for x in block],padded,device)
              output=[]
              for j,(ix,candidate,rooms) in enumerate(block):
                  original=int(selected[ix])
                  uid=int(state["users"][original])
                  true_id=int(state["positives"][original])
                  past,recent=state["histories"][ix]
                  mem=score_history(candidate,state["popularity"],past,recent)
                  m_rank=memory_rank(candidate,mem,true_id)
                  d={"event_id":int(state["events"][original]),"user_id":uid,
                     "split":"DEV","candidate_count":len(candidate),
                     "memory_rank":m_rank,"memory_ndcg10":ndcg(m_rank),
                     "x_hist_event_count":float(state["features"][ix]["hist_events_all"]),
                     "x_hist_warm_count":float(state["features"][ix]["hist_events_warm"]),
                     "x_hist_distinct":float(state["features"][ix]["hist_distinct_warm"]),
                     "x_hist_repeat_max":float(state["features"][ix]["hist_max_repeat"]),
                     "x_hist_short_unique":float(state["features"][ix]["hist_short_unique"]),
                     "x_memory_history_supported_share":float(np.mean((mem-0.10*state["popularity"][candidate])>1e-12)),
                     "x_candidate_log_count":float(math.log1p(len(candidate)))}
                  for model in ("sasrec","gru4rec"):
                      scores=raw[model][j,:len(candidate)]
                      true_score=float(scores[np.searchsorted(candidate,true_id)])
                      outrank=(scores>true_score)|((scores==true_score)&(candidate<true_id))
                      rank=1+int(np.count_nonzero(outrank))
                      top=np.partition(scores,-min(11,len(scores)))[-min(11,len(scores)):]
                      top.sort()
