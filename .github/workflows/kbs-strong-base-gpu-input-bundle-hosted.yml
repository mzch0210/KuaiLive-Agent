name: KBS strong-base GPU input bundle hosted

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kbs-strong-base-gpu-input-bundle-hosted.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: kbs-strong-base-gpu-input-bundle-hosted-${{ github.ref }}
  cancel-in-progress: false

env:
  DATA_RUN: '35554842873'
  DATA_ARTIFACT: 'room-collision-data-35554842873'
  SEED_RUN: '35729896175'
  SEED_ARTIFACT: 'seed-20260918'
  P12_RUN: '35698158121'
  P12_ARTIFACT: 'liverec-p1-2-dev-freeze-35698158121'
  P12_OOF_SHA256: '9757064252c097934fa31f10a68e11bb43853ca1132aaa49da2b9794f60d3816'
  RECHORUS_COMMIT: 'c164ec4303cc20ddcfbd1b57de366a481811d1e5'
  TWITCH_100K_URL: 'https://mcauleylab.ucsd.edu/public_datasets/gdrive/twitch/100k_a.csv'
  TWITCH_100K_SHA256: '11d3bdb49683f651eb6b0ba806bf317db68646efc0c7de2d02d750201fd8ef69'
  ROOM_DATASET: 'KuaiLiveShopRoomDualID'

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download frozen legal-candidate data
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: ${{ env.DATA_ARTIFACT }}
          path: shared
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.DATA_RUN }}

      - name: Download frozen seed-20260918 report
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: ${{ env.SEED_ARTIFACT }}
          path: seed18
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SEED_RUN }}

      - name: Download frozen LiveRec DEV evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: ${{ env.P12_ARTIFACT }}
          path: p12
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.P12_RUN }}

      - name: Acquire pinned external benchmark inputs on hosted runner
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/THUwangcy/ReChorus.git rechorus_src
          cd rechorus_src
          git checkout "$RECHORUS_COMMIT"
          cd "$GITHUB_WORKSPACE"
          mkdir -p twitch_data
          python - <<'PY'
          import os, time, urllib.request
          url=os.environ['TWITCH_100K_URL']
          out='twitch_data/100k.csv'
          for i in range(5):
              try:
                  urllib.request.urlretrieve(url, out)
                  break
              except Exception:
                  if i==4: raise
                  time.sleep(5*(i+1))
          print('downloaded', out)
          PY
          echo "$TWITCH_100K_SHA256  twitch_data/100k.csv" | sha256sum -c -

      - name: Build slim immutable KuaiLive and Twitch bundles
        shell: bash
        run: |
          set -euo pipefail
          rm -rf kuailive_bundle twitch_bundle
          mkdir -p "kuailive_bundle/rechorus_dual/$ROOM_DATASET" kuailive_bundle/frozen_dual kuailive_bundle/third_party/ReChorus
          mkdir -p twitch_bundle/frozen_p12 twitch_bundle/twitch_data

          cp "shared/rechorus_dual/$ROOM_DATASET/train.csv" "kuailive_bundle/rechorus_dual/$ROOM_DATASET/train.csv"
          cp "shared/rechorus_dual/$ROOM_DATASET/dev.csv" "kuailive_bundle/rechorus_dual/$ROOM_DATASET/dev.csv"
          cp "shared/rechorus_dual/$ROOM_DATASET/test.csv" "kuailive_bundle/rechorus_dual/$ROOM_DATASET/test.csv"
          cp "shared/rechorus_dual/$ROOM_DATASET/export_meta.json" "kuailive_bundle/rechorus_dual/$ROOM_DATASET/export_meta.json"
          cp seed18/dual_id_results/report.json kuailive_bundle/frozen_dual/report.json
          cp -a rechorus_src/src kuailive_bundle/third_party/ReChorus/src

          cp p12/gate_freeze/p1_2_dev_oof_predictions.csv.gz twitch_bundle/frozen_p12/p1_2_dev_oof_predictions.csv.gz
          cp twitch_data/100k.csv twitch_bundle/twitch_data/100k.csv
          echo "$P12_OOF_SHA256  twitch_bundle/frozen_p12/p1_2_dev_oof_predictions.csv.gz" | sha256sum -c -
          echo "$TWITCH_100K_SHA256  twitch_bundle/twitch_data/100k.csv" | sha256sum -c -

          python - <<'PY'
          import json
          m=json.load(open('kuailive_bundle/rechorus_dual/KuaiLiveShopRoomDualID/export_meta.json'))
          r=json.load(open('kuailive_bundle/frozen_dual/report.json'))
          assert m['seed']==20260918 and m['n_neg']==574 and m['candidate_count']==575
          assert r['task']=='next_live_room' and r['users']==10222 and r['candidate_count']==575
          assert abs(r['dual_id_test_ndcg10']-0.6171415058148384) < 1e-12
          assert abs(r['dual_id_dev_ndcg10']-0.6213436703569637) < 1e-12
          print('frozen room protocol and Dual-ID report verified')
          PY

          (
            cd kuailive_bundle
            find rechorus_dual frozen_dual third_party -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            cat > BUNDLE_INFO.json <<JSON
          {
            "purpose": "self-hosted RTX3090 KuaiLive strong-base competitiveness inputs",
            "room_data_run": $DATA_RUN,
            "room_data_artifact": "$DATA_ARTIFACT",
            "seed_run": $SEED_RUN,
            "seed_artifact": "$SEED_ARTIFACT",
            "rechorus_commit": "$RECHORUS_COMMIT",
            "candidate_count": 575,
            "n_neg": 574
          }
          JSON
          )

          (
            cd twitch_bundle
            find frozen_p12 twitch_data -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            cat > BUNDLE_INFO.json <<JSON
          {
            "purpose": "self-hosted RTX3090 Twitch DEV-only competitiveness inputs",
            "p12_run": $P12_RUN,
            "p12_artifact": "$P12_ARTIFACT",
            "twitch_test_policy": "DEV-only competitiveness; P1.3 untouched test is not included"
          }
          JSON
          )
          du -sh kuailive_bundle twitch_bundle

      - name: Upload KuaiLive GPU input bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kbs-strong-base-kuailive-input-${{ github.run_id }}
          path: kuailive_bundle/**
          if-no-files-found: error
          compression-level: 9
          retention-days: 90

      - name: Upload Twitch GPU input bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kbs-strong-base-twitch-input-${{ github.run_id }}
          path: twitch_bundle/**
          if-no-files-found: error
          compression-level: 9
          retention-days: 90
